            { id: 3, question: "परागकोश (Anther) की सबसे बाहरी परत क्या कहलाती है?", options: ["एपिडर्मिस (Epidermis)","एंडोथीसियम","टैपेटम","मध्य परतें"], answer: "एपिडर्मिस (Epidermis)", chapter: "जनन" },
            { id: 4, question: "दोहरा निषेचन किसका विशेष लक्षण है?", options: ["आवृतबीजी (Angiosperms)","अनावृतबीजी","शैवाल","कवक"], answer: "आवृतबीजी (Angiosperms)", chapter: "जनन" },

            { id: 7, question: "जाइगोट (Zygote) का फैलोपियन नली से गर्भाशय तक का स्थानांतरण क्या कहलाता है?", options: ["ब्लास्टोसिस्ट","क्लीवेज","इंप्लांटेशन","गैस्ट्रुलेशन"], answer: "ब्लास्टोसिस्ट", chapter: "जनन" },
            { id: 8, question: "एमनियोसेंटेसिस (Amniocentesis) में किसका विश्लेषण किया जाता है?", options: ["उल्ब तरल (Amniotic Fluid)","रक्त","मूत्र","वीर्य"], answer: "उल्ब तरल (Amniotic Fluid)", chapter: "जनन" },
            { id: 9, question: "बीज के आवरण (Seed Coat) का निर्माण कौन करता है?", options: ["इंटेग्यूमेंट्स (Integuments)","भ्रूणकोश","अंडाशय भित्ति","परागकोश"], answer: "इंटेग्यूमेंट्स (Integuments)", chapter: "जनन" },
            { id: 10, question: "मानव में शुक्राणु के शीर्ष (Head) पर कौन सा अंग होता है?", options: ["एक्रोसोम (Acrosome)","माइटोकॉन्ड्रिया","न्यूक्लियस","सेंट्रिओल"], answer: "एक्रोसोम (Acrosome)", chapter: "जनन" },
            { id: 11, question: "जनसंख्या का आकार किस प्रकार की वृद्धि दिखाता है जब संसाधन सीमित होते हैं?", options: ["लॉजिस्टिक वृद्धि (Logistic Growth)","घातांक वृद्धि","रेखीय वृद्धि","निश्चित वृद्धि"], answer: "लॉजिस्टिक वृद्धि (Logistic Growth)", chapter: "जनन" },
            { id: 12, question: "पार्थेनोकार्पिक फल (Parthenocarpic Fruits) क्या होते हैं?", options: ["बीज रहित","बीज युक्त","निषेचन द्वारा बनते हैं","अगुणित"], answer: "बीज रहित", chapter: "जनन" },
            { id: 13, question: "फैलोपियन नली की रुकावट के लिए कौन सी सर्जिकल विधि प्रयुक्त होती है?", options: ["ट्यूबेक्टोमी (Tubectomy)","वैसेक्टोमी","GIFT","ZIFT"], answer: "ट्यूबेक्टोमी (Tubectomy)", chapter: "जनन" },
            { id: 14, question: "परागकणों के अध्ययन को क्या कहते हैं?", options: ["पैलिनोलॉजी (Palynology)","हिस्टोलॉजी","साइटोलॉजी","माइकोलॉजी"], answer: "पैलिनोलॉजी (Palynology)", chapter: "जनन" },
            { id: 15, question: "एकाधिक भ्रूणों (Multiple Embryos) की उपस्थिति क्या कहलाती है?", options: ["पॉलीएम्ब्रियोनी (Polyembryony)","एपोगैमी","पार्थेनोजेनेसिस","एफोमिक्सिस"], answer: "पॉलीएम्ब्रियोनी (Polyembryony)", chapter: "जनन" },

            // इकाई II: आनुवंशिकी और विकास (Genetics and Evolution) - (Q21-45)
            { id: 16, question: "मेंडल का कौन सा नियम अपूर्ण प्रभाविता से टूटता है?", options: ["प्रभाविता का नियम","पृथक्करण का नियम","स्वतंत्र अपव्यूहन का नियम","युग्मकों की शुद्धता का नियम"], answer: "प्रभाविता का नियम", chapter: "आनुवंशिकी और विकास" },
            { id: 17, question: "डीएनए प्रतिकृति (DNA Replication) किस प्रक्रिया द्वारा होती है?", options: ["अर्ध-संरक्षी (Semi-conservative)","रूढ़िवादी","परिक्षेपी","अज्ञात"], answer: "अर्ध-संरक्षी (Semi-conservative)", chapter: "आनुवंशिकी और विकास" },
            { id: 18, question: "किस कोडॉन को 'स्टॉप कोडॉन' (Stop Codon) कहा जाता है?", options: ["UAA","AUG","GGG","CCU"], answer: "UAA", chapter: "आनुवंशिकी और विकास" },
            { id: 19, question: "डीएनए के किस भाग में प्रोटीन के लिए कोडिंग जानकारी होती है?", options: ["एग्जॉन (Exon)","इंट्रॉन","प्रमोटर","टर्मिनेटर"], answer: "एग्जॉन (Exon)", chapter: "आनुवंशिकी और विकास" },
            { id: 20, question: "ड्रोसोफिला में सहलग्नता की खोज किसने की?", options: ["टी.एच. मॉर्गन","मेंडल","सटन और बोवेरी","डार्विन"], answer: "टी.एच. मॉर्गन", chapter: "आनुवंशिकी और विकास" },
            { id: 21, question: "विकास (Evolution) का सबसे स्वीकृत आधुनिक सिद्धांत कौन सा है?", options: ["आधुनिक संश्लेषण सिद्धांत (Modern Synthesis Theory)","लेमार्कवाद","डार्विन का सिद्धांत","उत्परिवर्तन सिद्धांत"], answer: "आधुनिक संश्लेषण सिद्धांत (Modern Synthesis Theory)", chapter: "आनुवंशिकी और विकास" },
            { id: 22, question: "सिकल सेल एनीमिया में, अमीनो एसिड में क्या बदलाव होता है?", options: ["ग्लूटामिक एसिड से वैलाइन (Glutamic Acid to Valine)","वैलाइन से ग्लूटामिक एसिड","लाइसिन से प्रोलाइन","एलानिन से ग्लाइसिन"], answer: "ग्लूटामिक एसिड से वैलाइन (Glutamic Acid to Valine)", chapter: "आनुवंशिकी और विकास" },
            { id: 23, question: "एक 'जीन पूल' (Gene Pool) क्या है?", options: ["एक जनसंख्या में सभी जीन और उनके एलिल","एक ही गुणसूत्र पर जीन","जीन का संग्रह","सिर्फ अप्रभावी जीन"], answer: "एक जनसंख्या में सभी जीन और उनके एलिल", chapter: "आनुवंशिकी और विकास" },
            { id: 24, question: "क्रोमोसोमल विपथन (Chromosomal Aberrations) किसका कारण बन सकते हैं?", options: ["कैंसर","सामान्य बीमारियाँ","जीवाणु संक्रमण","पौधे की वृद्धि"], answer: "कैंसर", chapter: "आनुवंशिकी और विकास" },
            { id: 25, question: "मनुष्यों में XXY जीनोटाइप क्या दर्शाता है?", options: ["क्लाइनफेल्टर सिंड्रोम","टर्नर सिंड्रोम","डाउन सिंड्रोम","सुपर फीमेल"], answer: "क्लाइनफेल्टर सिंड्रोम", chapter: "आनुवंशिकी और विकास" },
            { id: 26, question: "डीएनए का संश्लेषण किस दिशा में होता है?", options: ["5' → 3'","3' → 5'","दोनों दिशाओं में","अनियमित"], answer: "5' → 3'", chapter: "आनुवंशिकी और विकास" },
            { id: 27, question: "जीवाश्मों (Fossils) का अध्ययन किस वैज्ञानिक प्रमाण को दर्शाता है?", options: ["जीवाश्म विज्ञान संबंधी प्रमाण","तुलनात्मक शारीरिकी","भ्रूणविज्ञान","जैव-भूगोल"], answer: "जीवाश्म विज्ञान संबंधी प्रमाण", chapter: "आनुवंशिकी और विकास" },
            { id: 28, question: "डीएनए और आरएनए में कौन सा नाइट्रोजन बेस अलग है?", options: ["थाइमिन और यूरेसिल","साइटोसिन और गुआनिन","एडेनाइन और गुआनिन","साइटोसिन और थाइमिन"], answer: "थाइमिन और यूरेसिल", chapter: "आनुवंशिकी और विकास" },
            { id: 29, question: "ओकाजाकी खंड (Okazaki Fragments) किस स्ट्रैंड पर संश्लेषित होते हैं?", options: ["लैगिंग स्ट्रैंड (Lagging Strand)","लीडिंग स्ट्रैंड","दोनों पर","किसी पर नहीं"], answer: "लैगिंग स्ट्रैंड (Lagging Strand)", chapter: "आनुवंशिकी और विकास" },
            { id: 30, question: "प्राकृतिक चयन (Natural Selection) के लिए कौन सी स्थिति आवश्यक है?", options: ["विविधता (Variation)","स्थिर जनसंख्या","केवल अप्रभावी लक्षण","जीन का पूर्ण अलगाव"], answer: "विविधता (Variation)", chapter: "आनुवंशिकी और विकास" },
            { id: 31, question: "X-सहलग्न अप्रभावी विकार से पीड़ित पुरुष की माँ कैसी हो सकती है?", options: ["वाहक (Carrier) या पीड़ित","हमेशा पीड़ित","हमेशा सामान्य","कभी वाहक नहीं"], answer: "वाहक (Carrier) या पीड़ित", chapter: "आनुवंशिकी और विकास" },
            { id: 32, question: "मनुष्यों में फिनाइलकेटोनूरिया (PKU) किसका उदाहरण है?", options: ["जन्मजात उपापचयी त्रुटि","क्रोमोसोमल विकार","X-सहलग्न प्रभावी विकार","बहुजीनी वंशागति"], answer: "जन्मजात उपापचयी त्रुटि", chapter: "आनुवंशिकी और विकास" },
            { id: 33, question: "जीन के नियमन (Regulation) में ऑपरेटर जीन कहाँ होता है?", options: ["प्रमोटर और संरचनात्मक जीन के बीच","संरचनात्मक जीन के बाद","प्रमोटर से पहले","रिप्रेसर प्रोटीन से जुड़ा हुआ"], answer: "प्रमोटर और संरचनात्मक जीन के बीच", chapter: "आनुवंशिकी और विकास" },
            { id: 34, question: "आरएनए पॉलीमरेज़ (RNA Polymerase) प्रतिलेखन की प्रक्रिया कहाँ शुरू करता है?", options: ["प्रमोटर साइट","टर्मिनेटर साइट","संरचनात्मक जीन","इंट्रॉन"], answer: "प्रमोटर साइट", chapter: "आनुवंशिकी और विकास" },
            { id: 35, question: "एक जीन जो कई फीनोटाइपिक अभिव्यक्तियों को नियंत्रित करता है, क्या कहलाता है?", options: ["प्लिओट्रॉपी (Pleiotropy)","पॉलीजीनी","सह-प्रभाविता","एपीस्टैसिस"], answer: "प्लिओट्रॉपी (Pleiotropy)", chapter: "आनुवंशिकी और विकास" },

            { id: 73, question: "किसी क्षेत्र की स्थानिक प्रजातियाँ (Endemic Species) क्या होती हैं?", options: ["जो केवल उस क्षेत्र में पाई जाती हैं","जो हर जगह पाई जाती हैं","जो विलुप्त होने वाली हैं","जो आक्रामक हैं"], answer: "जो केवल उस क्षेत्र में पाई जाती हैं", chapter: "पारिस्थितिकी" },

        // --- JavaScript फ़ंक्शंस (रेंडरिंग और चेकिंग लॉजिक) ---
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';
            let currentChapter = '';

            testQuestions.forEach((mcq, index) => {
                // अध्याय के आधार पर हेडिंग जोड़ना (प्रमुख इकाइयों के लिए)
                if (mcq.chapter !== currentChapter) {
                    let unitTitle = '';
                    if (mcq.chapter === 'जनन') unitTitle = 'इकाई I: जनन (Reproduction)';
                    else if (mcq.chapter === 'आनुवंशिकी और विकास') unitTitle = 'इकाई II: आनुवंशिकी और विकास (Genetics and Evolution)';
                    else if (mcq.chapter === 'मानव कल्याण') unitTitle = 'इकाई III: मानव कल्याण में जीव विज्ञान (Biology and Human Welfare)';
                    else if (mcq.chapter === 'जैव प्रौद्योगिकी') unitTitle = 'इकाई IV: जैव प्रौद्योगिकी (Biotechnology)';
                    else if (mcq.chapter === 'पारिस्थितिकी') unitTitle = 'इकाई V: पारिस्थितिकी और पर्यावरण (Ecology and Environment)';
                    
                    htmlContent += `<h3>${unitTitle}</h3>`;
                    currentChapter = mcq.chapter;
                }

                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    const displayOption = option; 
                    
                    htmlContent += `<label><input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${displayOption}</label>`;
                });
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });
            form.innerHTML = htmlContent;
        }

        function checkAnswers(event) {
            if (event) event.preventDefault(); 
            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');
            
            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';

                const correctAnswerDisplay = mcq.answer;

                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                }
            });

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score / totalQuestions >= 0.8 ? 'green' : (score / totalQuestions >= 0.5 ? 'orange' : 'red')}; font-size: 1.2em;">
                    ${score / totalQuestions >= 0.8 ? 'उत्कृष्ट! आपने संपूर्ण पाठ्यक्रम को बहुत अच्छे से कवर किया है। 🌟' : (score / totalQuestions >= 0.5 ? 'अच्छा प्रयास। कुछ महत्वपूर्ण इकाइयों पर अधिक ध्यान देने की आवश्यकता है।' : 'सिद्धांतों को फिर से दोहराएं। यह एक संपूर्ण पाठ्यक्रम की तैयारी का समय है।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;
            window.scrollTo(0, 0);
        }

        window.onload = renderTest;

    </script>
