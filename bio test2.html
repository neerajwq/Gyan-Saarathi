    <script>
        // --- 100 MCQs का डेटा सरणी ---
        const testQuestions = [
            // मेंडलवाद (Mendelism)
            { id: 1, question: "मेंडल ने अपने प्रयोगों के लिए किस पौधे का चयन किया?", options: ["मक्का","चना","पायसम सैटिवम (मटर)","गेहूँ"], answer: "पायसम सैटिवम (मटर)", chapter: "मेंडलवाद" },
            { id: 2, question: "मेंडल के पहले नियम को क्या कहा जाता है?", options: ["प्रभाविता का नियम","पृथक्करण का नियम","स्वतंत्र अपव्यूहन का नियम","संकरण का नियम"], answer: "प्रभाविता का नियम", chapter: "मेंडलवाद" },
            { id: 3, question: "एकसंकर क्रॉस (Monohybrid Cross) में F2 पीढ़ी का जीनोटाइप अनुपात क्या है?", options: ["3:1","1:2:1","9:3:3:1","1:1"], answer: "1:2:1", chapter: "मेंडलवाद" },
            { id: 4, question: "द्विसंकर क्रॉस (Dihybrid Cross) में F2 पीढ़ी का फीनोटाइप अनुपात क्या है?", options: ["1:2:1","3:1","9:3:3:1","1:1:1:1"], answer: "9:3:3:1", chapter: "मेंडलवाद" },
            { id: 5, question: "जीन के वैकल्पिक रूप (Alternative forms) को क्या कहते हैं?", options: ["युग्मक","एलिल","क्रोमोसोम","लोकी"], answer: "एलिल", chapter: "मेंडलवाद" },
            { id: 6, question: "यदि दो एलिल समान हों, तो उस स्थिति को क्या कहते हैं?", options: ["विषमयुग्मजी","समयुग्मजी","प्रभावी","अप्रभावी"], answer: "समयुग्मजी", chapter: "मेंडलवाद" },
            { id: 7, question: "वह प्रक्रिया जिसके द्वारा F1 पीढ़ी को अप्रभावी जनक के साथ क्रॉस कराया जाता है?", options: ["बैक क्रॉस","टेस्ट क्रॉस","रेसिप्रोकल क्रॉस","मोनोहाइब्रिड क्रॉस"], answer: "टेस्ट क्रॉस", chapter: "मेंडलवाद" },
            { id: 8, question: "प्रभाविता का नियम कहाँ लागू नहीं होता है?", options: ["सह-प्रभाविता (Co-dominance)","अपूर्ण प्रभाविता (Incomplete Dominance)","दोनों 'A' और 'B'","केवल पूर्ण प्रभाविता"], answer: "दोनों 'A' और 'B'", chapter: "मेंडलवाद" },
            { id: 9, question: "मानव में ABO रक्त समूह किस प्रकार की वंशागति का उदाहरण है?", options: ["बहु-एलिलवाद (Multiple Allelism)","अप्रभावी वंशागति","यौन-सहलग्न वंशागति","सह-प्रभाविता"], answer: "बहु-एलिलवाद (Multiple Allelism)", chapter: "मेंडलवाद" },
            { id: 10, question: "मेंडल का 'पृथक्करण का नियम' किस सिद्धांत पर आधारित है?", options: ["युग्मकों की शुद्धता","स्वतंत्र अपव्यूहन","बहुजीनी वंशागति","प्रभाविता"], answer: "युग्मकों की शुद्धता", chapter: "मेंडलवाद" },

            // अपूर्ण प्रभाविता और सह-प्रभाविता (Incomplete & Co-dominance)
            { id: 11, question: "अपूर्ण प्रभाविता (Incomplete Dominance) का उदाहरण क्या है?", options: ["स्नैपड्रैगन (Mirabilis jalapa) में फूल का रंग","मानव ABO रक्त समूह","मटर में पौधे की ऊँचाई","फ्रूट फ्लाई में आँख का रंग"], answer: "स्नैपड्रैगन (Mirabilis jalapa) में फूल का रंग", chapter: "प्रभाविता के विचलन" },
            { id: 12, question: "अपूर्ण प्रभाविता में, F2 पीढ़ी का फीनोटाइप अनुपात क्या होता है?", options: ["3:1","1:2:1","9:3:3:1","1:1"], answer: "1:2:1", chapter: "प्रभाविता के विचलन" },
            { id: 13, question: "सह-प्रभाविता (Co-dominance) में विषमयुग्मजी (Heterozygous) जीव में क्या दिखता है?", options: ["दोनों एलिल की अभिव्यक्ति","केवल प्रभावी एलिल की अभिव्यक्ति","दोनों एलिल का मिश्रण","कोई अभिव्यक्ति नहीं"], answer: "दोनों एलिल की अभिव्यक्ति", chapter: "प्रभाविता के विचलन" },
            { id: 14, question: "मानव में ABO रक्त समूह किसका उदाहरण नहीं है?", options: ["अपूर्ण प्रभाविता","सह-प्रभाविता","बहु-एलिलवाद","प्रभाविता"], answer: "अपूर्ण प्रभाविता", chapter: "प्रभाविता के विचलन" },
            { id: 15, question: "मानव में एक ही जीन द्वारा एक से अधिक फीनोटाइप को नियंत्रित करने को क्या कहते हैं?", options: ["प्लिओट्रॉपी (Pleiotropy)","पॉलीजीनी","एपीस्टैसिस","सह-प्रभाविता"], answer: "प्लिओट्रॉपी (Pleiotropy)", chapter: "प्रभाविता के विचलन" },
            { id: 16, question: "AB रक्त समूह वाला व्यक्ति किस एलिल संयोजन का प्रदर्शन करता है?", options: ["IᴬIᴬ","IᴬIᴮ","Iᴬi","ii"], answer: "IᴬIᴮ", chapter: "प्रभाविता के विचलन" },
            { id: 17, question: "यदि माँ का रक्त समूह A और पिता का रक्त समूह B हो, तो बच्चे का रक्त समूह क्या नहीं हो सकता?", options: ["A","B","AB","O"], answer: "सभी हो सकते हैं (यदि माता-पिता विषमयुग्मजी हैं)", chapter: "प्रभाविता के विचलन" },
            { id: 18, question: "सह-प्रभाविता में F2 पीढ़ी का जीनोटाइप अनुपात क्या होता है?", options: ["1:2:1","3:1","2:1","4:0"], answer: "1:2:1", chapter: "प्रभाविता के विचलन" },
            { id: 19, question: "बहुजीनी वंशागति (Polygenic Inheritance) किसका उदाहरण है?", options: ["मानव त्वचा का रंग","एबीओ रक्त समूह","सिकल सेल एनीमिया","हीमोफीलिया"], answer: "मानव त्वचा का रंग", chapter: "प्रभाविता के विचलन" },
            { id: 20, question: "प्लिओट्रॉपी में, एक जीन का प्रभाव कहाँ दिखाई देता है?", options: ["कई फीनोटाइपिक लक्षण","केवल एक फीनोटाइपिक लक्षण","केवल आनुवंशिक सामग्री पर","केवल शरीर के आकार पर"], answer: "कई फीनोटाइपिक लक्षण", chapter: "प्रभाविता के विचलन" },

            // क्रोमोसोमल सिद्धांत (Chromosomal Theory)
            { id: 21, question: "वंशागति का क्रोमोसोमल सिद्धांत किसने प्रस्तावित किया?", options: ["सटन और बोवेरी","मेंडल","मॉर्गन","ह्यूगो डी व्रीस"], answer: "सटन और बोवेरी", chapter: "क्रोमोसोमल सिद्धांत" },
            { id: 22, question: "वंशागति की इकाई क्या है?", options: ["जीन","कोशिका","प्रोटॉन","न्यूट्रॉन"], answer: "जीन", chapter: "क्रोमोसोमल सिद्धांत" },
            { id: 23, question: "क्रोमोसोम (गुणसूत्र) कहाँ पाए जाते हैं?", options: ["केंद्रक","राइबोसोम","माइटोकॉन्ड्रिया","कोशिका द्रव्य"], answer: "केंद्रक", chapter: "क्रोमोसोमल सिद्धांत" },
            { id: 24, question: "सहलग्नता (Linkage) की खोज किसने की थी?", options: ["टी.एच. मॉर्गन","मेंडल","लेमार्क","डार्विन"], answer: "टी.एच. मॉर्गन", chapter: "क्रोमोसोमल सिद्धांत" },
            { id: 25, question: "सहलग्नता का अर्थ क्या है?", options: ["एक ही क्रोमोसोम पर जीन का साथ रहना","विभिन्न क्रोमोसोम पर जीन का अलग होना","जीन का विलुप्त होना","जीन का दोहराव"], answer: "एक ही क्रोमोसोम पर जीन का साथ रहना", chapter: "क्रोमोसोमल सिद्धांत" },
            { id: 26, question: "क्रॉसिंग ओवर (Crossing Over) किस अवस्था में होता है?", options: ["प्रोफेज I","मेटाफेज II","एनाफेज I","टेलोफेज II"], answer: "प्रोफेज I", chapter: "क्रोमोसोमल सिद्धांत" },
            { id: 27, question: "सहलग्नता और क्रॉसिंग ओवर के बीच क्या संबंध है?", options: ["सहलग्नता क्रॉसिंग ओवर को कम करती है","सहलग्नता क्रॉसिंग ओवर को बढ़ाती है","उनका कोई संबंध नहीं है","सहलग्नता क्रॉसिंग ओवर की दर निर्धारित करती है"], answer: "सहलग्नता क्रॉसिंग ओवर को कम करती है", chapter: "क्रोमोसोमल सिद्धांत" },
            { id: 28, question: "मानव में ऑटोसोम (Autosomes) की संख्या कितनी होती है?", options: ["22 जोड़े","23 जोड़े","1 जोड़ा","46"], answer: "22 जोड़े", chapter: "क्रोमोसोमल सिद्धांत" },
            { id: 29, question: "ड्रोसोफिला मेलानोगास्टर (फल मक्खी) पर किसने काम किया?", options: ["टी.एच. मॉर्गन","मेंडल","सटन","बोवेरी"], answer: "टी.एच. मॉर्गन", chapter: "क्रोमोसोमल सिद्धांत" },
            { id: 30, question: "वंशागति का क्रोमोसोमल सिद्धांत क्या बताता है?", options: ["जीन क्रोमोसोम पर स्थित होते हैं","जीन केंद्रक में स्थित होते हैं","क्रोमोसोम का कोई महत्व नहीं है","डीएनए में कोई जीन नहीं है"], answer: "जीन क्रोमोसोम पर स्थित होते हैं", chapter: "क्रोमोसोमल सिद्धांत" },

            // लिंग निर्धारण (Sex Determination)
            { id: 31, question: "मानव में लिंग निर्धारण का प्रकार क्या है?", options: ["XX-XY","ZZ-ZW","XX-XO","हेप्लो-डिप्लोइडी"], answer: "XX-XY", chapter: "लिंग निर्धारण" },
            { id: 32, question: "पुरुषों में कौन से लिंग क्रोमोसोम होते हैं?", options: ["XX","XY","XO","YY"], answer: "XY", chapter: "लिंग निर्धारण" },
            { id: 33, question: "स्त्रियों में कौन से लिंग क्रोमोसोम होते हैं?", options: ["XX","XY","XO","YY"], answer: "XX", chapter: "लिंग निर्धारण" },
            { id: 34, question: "टिड्डी (Grasshopper) में लिंग निर्धारण का प्रकार क्या है?", options: ["XX-XO","XX-XY","ZZ-ZW","हेप्लो-डिप्लोइडी"], answer: "XX-XO", chapter: "लिंग निर्धारण" },

        // --- JavaScript फ़ंक्शंस (रेंडरिंग और चेकिंग लॉजिक) ---
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';
            let currentChapter = '';

            testQuestions.forEach((mcq, index) => {
                // अध्याय के आधार पर हेडिंग जोड़ना
                if (mcq.chapter !== currentChapter) {
                    htmlContent += `<h3>${mcq.chapter.toUpperCase()}</h3>`;
                    currentChapter = mcq.chapter;
                }

                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    // गणितीय अभिव्यक्तियों को HTML एंटिटी में बदलने का प्रयास (यदि कोई हो)
                    const displayOption = option.replace(/IᴬIᴮ/g, 'I<sup>A</sup>I<sup>B</sup>').replace(/IᴬIᴬ/g, 'I<sup>A</sup>I<sup>A</sup>').replace(/Iᴬi/g, 'I<sup>A</sup>i').replace(/ii/g, 'ii').replace(/XʰY/g, 'X<sup>h</sup>Y').replace(/XᴴY/g, 'X<sup>H</sup>Y').replace(/XᴴXᴴ/g, 'X<sup>H</sup>X<sup>H</sup>').replace(/XʰXʰ/g, 'X<sup>h</sup>X<sup>h</sup>').replace(/Hbs Hbs/g, 'Hb<sup>s</sup>Hb<sup>s</sup>');

                    htmlContent += `<label><input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${displayOption}</label>`;
                });
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });
            form.innerHTML = htmlContent;
        }

        function checkAnswers(event) {
            if (event) event.preventDefault(); 
            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');
            
            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';

                const correctAnswerDisplay = mcq.answer.replace(/IᴬIᴮ/g, 'I<sup>A</sup>I<sup>B</sup>').replace(/IᴬIᴬ/g, 'I<sup>A</sup>I<sup>A</sup>').replace(/Iᴬi/g, 'I<sup>A</sup>i').replace(/ii/g, 'ii').replace(/XʰY/g, 'X<sup>h</sup>Y').replace(/XᴴY/g, 'X<sup>H</sup>Y').replace(/XᴴXᴴ/g, 'X<sup>H</sup>X<sup>H</sup>').replace(/XʰXʰ/g, 'X<sup>h</sup>X<sup>h</sup>').replace(/Hbs Hbs/g, 'Hb<sup>s</sup>Hb<sup>s</sup>');

                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                }
            });

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score / totalQuestions >= 0.8 ? 'green' : (score / totalQuestions >= 0.5 ? 'orange' : 'red')}; font-size: 1.2em;">
                    ${score / totalQuestions >= 0.8 ? 'उत्कृष्ट! आनुवंशिकी पर आपकी पकड़ मजबूत है। 🌟' : (score / totalQuestions >= 0.5 ? 'अच्छा प्रयास। मुख्य सिद्धांतों पर अधिक ध्यान दें।' : 'सिद्धांतों को फिर से दोहराएं।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;
            window.scrollTo(0, 0);
        }

        window.onload = renderTest;

    </script>
