        // --- JavaScript फ़ंक्शंस (रेंडरिंग और चेकिंग लॉजिक) ---
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';
            let currentChapter = '';

            testQuestions.forEach((mcq, index) => {
                // अध्याय के आधार पर हेडिंग जोड़ना
                if (mcq.chapter !== currentChapter) {
                    let unitTitle = '';
                    if (mcq.chapter === 'भौतिक रसायन') unitTitle = 'इकाई I: भौतिक रसायन (विलयन, इलेक्ट्रो, बलगतिकी, पृष्ठ)';
                    else if (mcq.chapter === 'अकार्बनिक रसायन') unitTitle = 'इकाई II: अकार्बनिक रसायन (D & F ब्लॉक, उपसहसंयोजक, P-ब्लॉक)';
                    else if (mcq.chapter === 'कार्बनिक रसायन') unitTitle = 'इकाई III: कार्बनिक रसायन (हैलोऐल्केन, ऐल्कोहॉल, ऐल्डिहाइड, ऐमीन, जैव-अणु)';
                    else if (mcq.chapter === 'अन्य') unitTitle = 'इकाई IV: बहुलक और दैनिक जीवन में रसायन';
                    
                    htmlContent += `<h3>${unitTitle}</h3>`;
                    currentChapter = mcq.chapter;
                }

                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    // प्रतीक प्रतिस्थापन: सबस्क्रिप्ट और सुपरस्क्रिप्ट का उपयोग
                    const displayOption = option
                        .replace(/cm⁻¹/g, 'cm<sup>-1</sup>')
                        .replace(/ohm⁻¹/g, 'ohm<sup>-1</sup>')
                        .replace(/S cm² mol⁻¹/g, 'S cm<sup>2</sup> mol<sup>-1</sup>')
                        .replace(/S cm⁻¹/g, 'S cm<sup>-1</sup>')
                        .replace(/E°/g, 'E&deg;')
                        .replace(/t₁\/₂/g, 't<sub>1/2</sub>')
                        .replace(/min⁻¹/g, 'min<sup>-1</sup>')
                        .replace(/Eₐ/g, 'E<sub>a</sub>')
                        .replace(/H₂/g, 'H<sub>2</sub>').replace(/O₂/g, 'O<sub>2</sub>')
                        .replace(/AgBr/g, 'AgBr')
                        .replace(/t₂g/g, 't<sub>2g</sub>').replace(/e₉/g, 'e<sub>g</sub>')
                        .replace(/dsp²/g, 'dsp<sup>2</sup>').replace(/sp³/g, 'sp<sup>3</sup>')
                        .replace(/d²sp³/g, 'd<sup>2</sup>sp<sup>3</sup>').replace(/sp³d/g, 'sp<sup>3</sup>d')
                        .replace(/PH₃/g, 'PH<sub>3</sub>').replace(/AsH₃/g, 'AsH<sub>3</sub>')
                        .replace(/SbH₃/g, 'SbH<sub>3</sub>').replace(/BiH₃/g, 'BiH<sub>3</sub>')
                        .replace(/O-O/g, 'O-O')
                        .replace(/3° > 2° > 1°/g, '3&deg; > 2&deg; > 1&deg;')
                        .replace(/1° > 2° > 3°/g, '1&deg; > 2&deg; > 3&deg;')
                        .replace(/2° > 1° > 3°/g, '2&deg; > 1&deg; > 3&deg;')
                        .replace(/1° > 3° > 2°/g, '1&deg; > 3&deg; > 2&deg;')
                        .replace(/R-X/g, 'R-X')
                        .replace(/CHCl₃/g, 'CHCl<sub>3</sub>').replace(/NaOH/g, 'NaOH')
                        .replace(/CF₃COOH/g, 'CF<sub>3</sub>COOH').replace(/CH₃COOH/g, 'CH<sub>3</sub>COOH')
                        .replace(/CH₃CH₂COOH/g, 'CH<sub>3</sub>CH<sub>2</sub>COOH').replace(/C₆H₅OH/g, 'C<sub>6</sub>H<sub>5</sub>OH')
                        .replace(/m-Nitroaniline/g, 'm-Nitroaniline')
                        .replace(/AgNO₂/g, 'AgNO<sub>2</sub>')
                        .replace(/H₂SO₄/g, 'H<sub>2</sub>SO<sub>4</sub>')
                        .replace(/C₆H₅N₂Cl/g, 'C<sub>6</sub>H<sub>5</sub>N<sub>2</sub>Cl')
                        .replace(/KMnO₄/g, 'KMnO<sub>4</sub>')
                        .replace(/Molar Mass \/ 5/g, 'Molar Mass / 5')
                        .replace(/Cr²⁺/g, 'Cr<sup>2+</sup>').replace(/Fe²⁺/g, 'Fe<sup>2+</sup>').replace(/Ni²⁺/g, 'Ni<sup>2+</sup>').replace(/Zn²⁺/g, 'Zn<sup>2+</sup>')
                        .replace(/N=N/g, 'N=N')
                        .replace(/Eₐ\/R/g, 'E<sub>a</sub>/R')
                        .replace(/Ni\(CO\)₄/g, 'Ni(CO)<sub>4</sub>')
                        .replace(/\[Ni\(CN\)₄\]²⁻/g, '\[Ni(CN)<sub>4</sub>\]<sup>2-</sup>')
                        .replace(/\[Co\(NH₃\)₆\]³⁺/g, '\[Co(NH<sub>3</sub>)<sub>6</sub>\]<sup>3+</sup>')
                        .replace(/\[Fe\(CN\)₆\]⁴⁻/g, '\[Fe(CN)<sub>6</sub>\]<sup>4-</sup>')
                        .replace(/C=O/g, 'C=O')
                        .replace(/δ\+/g, '&delta;+')
                        .replace(/δ\-/g, '&delta;-')
                        .replace(/F₂/g, 'F<sub>2</sub>')
                        .replace(/-COOH/g, '-COOH').replace(/-CHO/g, '-CHO').replace(/-OH/g, '-OH').replace(/-NH₂/g, '-NH<sub>2</sub>')
                        .replace(/-N=N-/g, '-N=N-')
                        .replace(/O₃/g, 'O<sub>3</sub>')
                        .replace(/B₁/g, 'B<sub>1</sub>').replace(/B₂/g, 'B<sub>2</sub>').replace(/C/g, 'C').replace(/D/g, 'D')
                        .replace(/R]₀/g, 'R]<sub>0</sub>');
                    
                    htmlContent += `<label><input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${displayOption}</label>`;
                });
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });
            form.innerHTML = htmlContent;
        }

        function checkAnswers(event) {
            if (event) event.preventDefault(); 
            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');
            
            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';

                const correctAnswerDisplay = mcq.answer
                    .replace(/cm⁻¹/g, 'cm<sup>-1</sup>')
                    .replace(/t₁\/₂/g, 't<sub>1/2</sub>')
                    .replace(/min⁻¹/g, 'min<sup>-1</sup>')
                    .replace(/E°/g, 'E&deg;')
                    .replace(/S-S/g, 'S-S')
                    .replace(/O-O/g, 'O-O')
                    .replace(/3° > 2° > 1°/g, '3&deg; > 2&deg; > 1&deg;')
                    .replace(/2°/g, '2&deg;')
                    .replace(/1°/g, '1&deg;')
                    .replace(/3°/g, '3&deg;')
                    .replace(/R-X/g, 'R-X')
                    .replace(/C₆H₅N₂Cl/g, 'C<sub>6</sub>H<sub>5</sub>N<sub>2</sub>Cl')
                    .replace(/KMnO₄/g, 'KMnO<sub>4</sub>')
                    .replace(/Molar Mass \/ 5/g, 'Molar Mass / 5')
                    .replace(/t₁\/₂ = 0.693 \/ k/g, 't<sub>1/2</sub> = 0.693 / k')
                    .replace(/CF₃COOH > CCl₃COOH > CH₃COOH/g, 'CF<sub>3</sub>COOH > CCl<sub>3</sub>COOH > CH<sub>3</sub>COOH')
                    .replace(/N=N/g, 'N=N')
                    .replace(/Ni\(CO\)₄/g, 'Ni(CO)<sub>4</sub>')
                    .replace(/CF₃COOH/g, 'CF<sub>3</sub>COOH')
                    .replace(/C-H/g, 'C-H')
                    .replace(/δ\+/g, '&delta;+')
                    .replace(/F₂/g, 'F<sub>2</sub>')
                    .replace(/B₁/g, 'B<sub>1</sub>');

                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                }
            });

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score / totalQuestions >= 0.8 ? 'green' : (score / totalQuestions >= 0.5 ? 'orange' : 'red')}; font-size: 1.2em;">
                    ${score / totalQuestions >= 0.8 ? 'अद्भुत! आपकी तैयारी बहुत मजबूत है। 💪' : (score / totalQuestions >= 0.5 ? 'अच्छा प्रयास। कमजोर क्षेत्रों पर ध्यान केंद्रित करें।' : 'मुख्य अवधारणाओं को दोहराएं। निरंतर अभ्यास की आवश्यकता है।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;
            window.scrollTo(0, 0);
        }

        window.onload = renderTest;

    </script>

</body>
</html>
