            { id: 90, question: "एक ऐल्कोहॉल का निर्जलीकरण (Dehydration) हमेशा किस नियम का पालन करता है?", options: ["सेटजेफ का नियम (Saytzeff's Rule)","मार्कोनीकॉफ का नियम","हॉफमैन का नियम","राउल्ट का नियम"], answer: "सेटजेफ का नियम (Saytzeff's Rule)", chapter: "कार्बनिक रसायन" },
            { id: 91, question: "न्यूक्लियोटाइड (Nucleotide) के घटक क्या हैं?", options: ["शर्करा, फॉस्फेट समूह, नाइट्रोजन बेस","केवल शर्करा और फॉस्फेट समूह","केवल नाइट्रोजन बेस और शर्करा","केवल नाइट्रोजन बेस और फॉस्फेट"], answer: "शर्करा, फॉस्फेट समूह, नाइट्रोजन बेस", chapter: "कार्बनिक रसायन" },
            { id: 92, question: "हीमोग्लोबिन (Haemoglobin) में कौन सा तत्व उपस्थित होता है?", options: ["लोहा (Fe)","कॉपर","जिंक","मैंगनीज"], answer: "लोहा (Fe)", chapter: "कार्बनिक रसायन" },
            { id: 93, question: "बहुलक में अंतराणुक बल (Intermolecular Forces) के आधार पर, कौन सा 'इलास्टोमर' (Elastomer) है?", options: ["ब्यूना-S (Buna-S)","पॉलीथीन","नायलॉन-6,6","टेफ्लॉन"], answer: "ब्यूना-S (Buna-S)", chapter: "अन्य" },
            { id: 94, question: "एंटी-फर्टिलिटी ड्रग (Anti-fertility drug) का उदाहरण क्या है?", options: ["नोरेथिनड्रोन (Norethindrone)","ओमेप्राजोल","एस्पिरिन","मॉर्फिन"], answer: "नोरेथिनड्रोन (Norethindrone)", chapter: "अन्य" },
            { id: 95, question: "वह विटामिन जो वसा में घुलनशील (Fat Soluble) नहीं है?", options: ["विटामिन C","विटामिन A","विटामिन D","विटामिन K"], answer: "विटामिन C", chapter: "कार्बनिक रसायन" },
            { id: 96, question: "Fe²⁺ (d⁶) आयन किस प्रकार का चुंबकीय व्यवहार (Magnetic Behavior) प्रदर्शित करता है?", options: ["अनुचुंबकीय (Paramagnetic)","प्रतिचुंबकीय","लौहचुंबकीय","प्रतिलौहचुंबकीय"], answer: "अनुचुंबकीय (Paramagnetic)", chapter: "अकार्बनिक रसायन" },
            { id: 97, question: "उपसहसंयोजक यौगिकों में, क्रिस्टल क्षेत्र विपाटन ऊर्जा (Crystal Field Splitting Energy) किस पर निर्भर करती है?", options: ["लिगेंड की प्रकृति","धातु आयन की ऑक्सीकरण अवस्था","धातु आयन की ज्यामिति","उपर्युक्त सभी"], answer: "उपर्युक्त सभी", chapter: "अकार्बनिक रसायन" },
            { id: 98, question: "कौन सा कार्बोक्सिलिक अम्ल 'आयोडोफॉर्म परीक्षण' (Iodoform Test) देता है?", options: ["मेथिल एसीटेट (Methyl Acetate)","प्रोपेनोइक अम्ल","बेंजोइक अम्ल","फार्मिक अम्ल"], answer: "मेथिल एसीटेट (Methyl Acetate)", chapter: "कार्बनिक रसायन" },
            { id: 99, question: "विलयन का क्वथनांक (Boiling Point) बढ़ने पर विलायक का वाष्प दाब (Vapor Pressure) क्या होता है?", options: ["घटता है","बढ़ता है","अपरिवर्तित रहता है","अनिश्चित"], answer: "घटता है", chapter: "भौतिक रसायन" },
            { id: 100, question: "प्राथमिक ऐल्कोहॉल का अम्लीय K₂Cr₂O₇ द्वारा अंतिम ऑक्सीकरण उत्पाद क्या है?", options: ["कार्बोक्सिलिक अम्ल (Carboxylic Acid)","ऐल्डिहाइड","ईथर","कीटोन"], answer: "कार्बोक्सिलिक अम्ल (Carboxylic Acid)", chapter: "कार्बनिक रसायन" }
        ];


        // --- JavaScript फ़ंक्शंस (रेंडरिंग और चेकिंग लॉजिक) ---
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';
            let currentChapter = '';

            testQuestions.forEach((mcq, index) => {
                // अध्याय के आधार पर हेडिंग जोड़ना
                if (mcq.chapter !== currentChapter) {
                    let unitTitle = '';
                    if (mcq.chapter === 'भौतिक रसायन') unitTitle = 'इकाई I: भौतिक रसायन (विलयन, इलेक्ट्रो, बलगतिकी, पृष्ठ)';
                    else if (mcq.chapter === 'अकार्बनिक रसायन') unitTitle = 'इकाई II: अकार्बनिक रसायन (D & F ब्लॉक, उपसहसंयोजक, P-ब्लॉक)';
                    else if (mcq.chapter === 'कार्बनिक रसायन') unitTitle = 'इकाई III: कार्बनिक रसायन (हैलोऐल्केन, ऐल्कोहॉल, ऐल्डिहाइड, ऐमीन, जैव-अणु)';
                    else if (mcq.chapter === 'अन्य') unitTitle = 'इकाई IV: बहुलक और दैनिक जीवन में रसायन';
                    
                    htmlContent += `<h3>${unitTitle}</h3>`;
                    currentChapter = mcq.chapter;
                }

                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    // प्रतीक प्रतिस्थापन: सबस्क्रिप्ट और सुपरस्क्रिप्ट का उपयोग
                    const displayOption = option
                        .replace(/लीटर⁻¹/g, 'लीटर<sup>-1</sup>')
                        .replace(/सेकंड⁻¹/g, 'सेकंड<sup>-1</sup>')
                        .replace(/किलोग्राम⁻¹/g, 'किलोग्राम<sup>-1</sup>')
                        .replace(/cm² mol⁻¹/g, 'cm<sup>2</sup> mol<sup>-1</sup>')
                        .replace(/Ni-Cd/g, 'Ni-Cd')
                        .replace(/4f/g, '4f')
                        .replace(/P ब्लॉक/g, 'P ब्लॉक')
                        .replace(/H₃PO₃/g, 'H<sub>3</sub>PO<sub>3</sub>')
                        .replace(/\(OF₂\)/g, '(OF<sub>2</sub>)')
                        .replace(/t₂g/g, 't<sub>2g</sub>').replace(/e₉/g, 'e<sub>g</sub>')
                        .replace(/1°, 2°, और 3° ऐल्कोहॉल/g, '1&deg;, 2&deg;, और 3&deg; ऐल्कोहॉल')
                        .replace(/-OH/g, '-OH').replace(/-COOH/g, '-COOH')
                        .replace(/C₆H₅N₂Cl/g, 'C<sub>6</sub>H<sub>5</sub>N<sub>2</sub>Cl')
                        .replace(/Fe²⁺/g, 'Fe<sup>2+</sup>').replace(/d⁶/g, 'd<sup>6</sup>')
                        .replace(/C-X/g, 'C-X')
                        .replace(/NH₃/g, 'NH<sub>3</sub>').replace(/PH₃/g, 'PH<sub>3</sub>').replace(/AsH₃/g, 'AsH<sub>3</sub>').replace(/BiH₃/g, 'BiH<sub>3</sub>')
                        .replace(/CHCl₃/g, 'CHCl<sub>3</sub>')
                        .replace(/CF₃COOH > CCl₃COOH > CH₃COOH/g, 'CF<sub>3</sub>COOH > CCl<sub>3</sub>COOH > CH<sub>3</sub>COOH')
                        .replace(/CH₃COOH > CCl₃COOH > CF₃COOH/g, 'CH<sub>3</sub>COOH > CCl<sub>3</sub>COOH > CF<sub>3</sub>COOH')
                        .replace(/CCl₃COOH > CH₃COOH > CF₃COOH/g, 'CCl<sub>3</sub>COOH > CH<sub>3</sub>COOH > CF<sub>3</sub>COOH')
                        .replace(/CH₃COOH < CCl₃COOH < CF₃COOH/g, 'CH<sub>3</sub>COOH < CCl<sub>3</sub>COOH < CF<sub>3</sub>COOH')
                        .replace(/H₂O/g, 'H<sub>2</sub>O').replace(/H₂S/g, 'H<sub>2</sub>S').replace(/HF/g, 'HF').replace(/H₂Se/g, 'H<sub>2</sub>Se').replace(/H₂Te/g, 'H<sub>2</sub>Te')
                        .replace(/Br₂\/KOH/g, 'Br<sub>2</sub>/KOH')
                        .replace(/Zn-Hg\/HCl/g, 'Zn-Hg/HCl')
                        .replace(/NaNO₂\/HCl/g, 'NaNO<sub>2</sub>/HCl')
                        .replace(/H₂\/Ni/g, 'H<sub>2</sub>/Ni')
                        .replace(/K₂Cr₂O₇/g, 'K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub>')
                        .replace(/Fe²⁺/g, 'Fe<sup>2+</sup>');
                    
                    htmlContent += `<label><input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${displayOption}</label>`;
                });
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });
            form.innerHTML = htmlContent;
        }

        function checkAnswers(event) {
            if (event) event.preventDefault(); 
            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');
            
            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';

                const correctAnswerDisplay = mcq.answer
                    .replace(/लीटर⁻¹/g, 'लीटर<sup>-1</sup>')
                    .replace(/सेकंड⁻¹/g, 'सेकंड<sup>-1</sup>')
                    .replace(/किलोग्राम⁻¹/g, 'किलोग्राम<sup>-1</sup>')
                    .replace(/cm² mol⁻¹/g, 'cm<sup>2</sup> mol<sup>-1</sup>')
                    .replace(/Ni-Cd/g, 'Ni-Cd')
                    .replace(/4f/g, '4f')
                    .replace(/\(OF₂\)/g, '(OF<sub>2</sub>)')
                    .replace(/C₆H₅N₂Cl/g, 'C<sub>6</sub>H<sub>5</sub>N<sub>2</sub>Cl')
                    .replace(/NH₃/g, 'NH<sub>3</sub>')
                    .replace(/H₂O/g, 'H<sub>2</sub>O')
                    .replace(/H₂Te/g, 'H<sub>2</sub>Te')
                    .replace(/Fe²⁺/g, 'Fe<sup>2+</sup>')
                    .replace(/CF₃COOH > CCl₃COOH > CH₃COOH/g, 'CF<sub>3</sub>COOH > CCl<sub>3</sub>COOH > CH<sub>3</sub>COOH');

                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid darkgreen';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                }
            });

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score / totalQuestions >= 0.8 ? 'darkgreen' : (score / totalQuestions >= 0.5 ? 'orange' : 'red')}; font-size: 1.2em;">
                    ${score / totalQuestions >= 0.8 ? 'उत्कृष्ट! आपकी तैयारी उच्च स्तर पर है। 💯' : (score / totalQuestions >= 0.5 ? 'सराहनीय! अब विशिष्ट कमजोरियों पर काम करें।' : 'पुनरावृत्ति (Revision) और गहन अभ्यास पर ध्यान दें।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;
            window.scrollTo(0, 0);
        }

        window.onload = renderTest;

    </script>

</body>
