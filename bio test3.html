    <script>
        // --- 100 MCQs का डेटा सरणी ---
        const testQuestions = [
            // रोग और रोगज़नक़ (Diseases and Pathogens)
            { id: 1, question: "मलेरिया रोग का कारक जीव (Pathogen) क्या है?", options: ["प्लाज्मोडियम","एंटअमीबा","साल्मोनेला","माइक्रोस्पोरम"], answer: "प्लाज्मोडियम", chapter: "रोग" },
            { id: 2, question: "टाइफाइड ज्वर का कारण बनने वाला जीवाणु (Bacteria) कौन सा है?", options: ["साल्मोनेला टाइफी","विब्रियो कोलेरी","स्ट्रेप्टोकोकस","माइकोबैक्टीरियम"], answer: "साल्मोनेला टाइफी", chapter: "रोग" },
            { id: 3, question: "सामान्य जुकाम (Common Cold) किस वायरस के कारण होता है?", options: ["राइनोवायरस","पोलियोवायरस","हर्पीस वायरस","रेट्रोवायरस"], answer: "राइनोवायरस", chapter: "रोग" },
            { id: 4, question: "एस्केरियासिस (Ascariasis) का संचारण कैसे होता है?", options: ["दूषित पानी और भोजन","मच्छर का काटना","यौन संपर्क","सीधे संपर्क से"], answer: "दूषित पानी और भोजन", chapter: "रोग" },
            { id: 5, question: "फाइलेरिया (Filariasis) रोग किस कृमि (Worm) के कारण होता है?", options: ["वुचेरेरिया बैनक्रॉफ्टी","एस्केरिस","टीनिया सोलियम","गोलकृमि"], answer: "वुचेरेरिया बैनक्रॉफ्टी", chapter: "रोग" },
            { id: 6, question: "दाद (Ringworm) एक सामान्य रोग है जिसका कारण है:", options: ["कवक (Fungi)","जीवाणु","विषाणु","प्रोटोजोआ"], answer: "कवक (Fungi)", chapter: "रोग" },
            { id: 7, question: "निमोनिया (Pneumonia) में कौन सा अंग प्रभावित होता है?", options: ["फेफड़े (एल्विओली)","यकृत","छोटी आंत","प्लीहा"], answer: "फेफड़े (एल्विओली)", chapter: "रोग" },
            { id: 8, question: "मलेरिया के रोगवाहक (Vector) का नाम क्या है?", options: ["मादा एनाफिलीज मच्छर","एडीज मच्छर","क्यूलेक्स मच्छर","घरेलू मक्खी"], answer: "मादा एनाफिलीज मच्छर", chapter: "रोग" },
            { id: 9, question: "एड्स (AIDS) किस प्रकार का वायरस जनित रोग है?", options: ["रेट्रोवायरस","एडेनोवायरस","राइनोवायरस","हर्पीस वायरस"], answer: "रेट्रोवायरस", chapter: "रोग" },
            { id: 10, question: "अमीबीय पेचिश (Amoebic Dysentery) का कारक प्रोटोजोआ कौन सा है?", options: ["एंटअमीबा हिस्टोलिटिका","प्लाज्मोडियम","ट्रिपैनोसोमा","गिआर्डिया"], answer: "एंटअमीबा हिस्टोलिटिका", chapter: "रोग" },

            // प्रतिरक्षा (Immunity)
            { id: 11, question: "जन्म के समय से मौजूद प्रतिरक्षा को क्या कहते हैं?", options: ["सहज प्रतिरक्षा (Innate Immunity)","उपार्जित प्रतिरक्षा (Acquired Immunity)","सक्रिय प्रतिरक्षा","निष्क्रिय प्रतिरक्षा"], answer: "सहज प्रतिरक्षा (Innate Immunity)", chapter: "प्रतिरक्षा" },
            { id: 12, question: "टीकाकरण (Vaccination) किस प्रकार की प्रतिरक्षा प्रदान करता है?", options: ["सक्रिय प्रतिरक्षा","निष्क्रिय प्रतिरक्षा","सहज प्रतिरक्षा","प्राकृतिक निष्क्रिय प्रतिरक्षा"], answer: "सक्रिय प्रतिरक्षा", chapter: "प्रतिरक्षा" },
            { id: 13, question: "स्तनपान के माध्यम से शिशु को माँ से प्राप्त होने वाली एंटीबॉडी कौन सी है?", options: ["IgA","IgG","IgM","IgE"], answer: "IgA", chapter: "प्रतिरक्षा" },
            { id: 14, question: "एंटीबॉडी (Antibody) किस प्रकार के प्रोटीन होते हैं?", options: ["इम्युनोग्लोबुलिन (Immunoglobulin)","केराटिन","एल्ब्यूमिन","फाइब्रिनोजेन"], answer: "इम्युनोग्लोबुलिन (Immunoglobulin)", chapter: "प्रतिरक्षा" },
            { id: 15, question: "प्राथमिक और द्वितीयक लिम्फोइड अंग कौन से हैं?", options: ["अस्थि मज्जा और थाइमस","प्लीहा और लिम्फ नोड्स","दोनों 'A' और 'B'","केवल अस्थि मज्जा"], answer: "दोनों 'A' और 'B'", chapter: "प्रतिरक्षा" },
            { id: 16, question: "B-लिम्फोसाइट्स का मुख्य कार्य क्या है?", options: ["एंटीबॉडी का उत्पादन","कोशिका-मध्यस्थ प्रतिरक्षा","भक्षण (Phagocytosis)","विषाणुओं को नष्ट करना"], answer: "एंटीबॉडी का उत्पादन", chapter: "प्रतिरक्षा" },
            { id: 17, question: "T-लिम्फोसाइट्स किस प्रतिरक्षा के लिए जिम्मेदार होते हैं?", options: ["कोशिका-मध्यस्थ प्रतिरक्षा (Cell-mediated immunity)","एंटीबॉडी-मध्यस्थ प्रतिरक्षा","सहज प्रतिरक्षा","निष्क्रिय प्रतिरक्षा"], answer: "कोशिका-मध्यस्थ प्रतिरक्षा (Cell-mediated immunity)", chapter: "प्रतिरक्षा" },
            { id: 18, question: "सूजन (Inflammation) किस प्रकार की प्रतिरक्षा प्रतिक्रिया है?", options: ["सहज प्रतिरक्षा","उपार्जित प्रतिरक्षा","सक्रिय प्रतिरक्षा","विशिष्ट प्रतिक्रिया"], answer: "सहज प्रतिरक्षा", chapter: "प्रतिरक्षा" },
            { id: 19, question: " एलर्जी (Allergy) में कौन सी एंटीबॉडी शामिल होती है?", options: ["IgE","IgG","IgM","IgA"], answer: "IgE", chapter: "प्रतिरक्षा" },
            { id: 20, question: "स्व-प्रतिरक्षा रोग (Autoimmune Disease) का एक उदाहरण क्या है?", options: ["संधिशोथ (Rheumatoid Arthritis)","एड्स","मलेरिया","टाइफाइड"], answer: "संधिशोथ (Rheumatoid Arthritis)", chapter: "प्रतिरक्षा" },

            // एड्स (AIDS)
            { id: 21, question: "एड्स का पूर्ण रूप क्या है?", options: ["एक्वायर्ड इम्यूनो डेफिसिएंसी सिंड्रोम","एक्वायर्ड इम्यून डिजीज सिंड्रोम","एंटीबॉडी इम्यून डेफिसिएंसी सिंड्रोम","एक्टिवेटेड इम्यून डिजीज सिंड्रोम"], answer: "एक्वायर्ड इम्यूनो डेफिसिएंसी सिंड्रोम", chapter: "एड्स" },
            { id: 22, question: "एड्स का कारक वायरस (Virus) क्या है?", options: ["एचआईवी (HIV)","राइनोवायरस","पोलियोवायरस","हेपेटाइटिस वायरस"], answer: "एचआईवी (HIV)", chapter: "एड्स" },
            { id: 23, question: "एचआईवी किस कोशिका पर हमला करता है?", options: ["सहायक T-लिम्फोसाइट्स","B-लिम्फोसाइट्स","लाल रक्त कोशिकाएं","न्यूट्रोफिल्स"], answer: "सहायक T-लिम्फोसाइट्स", chapter: "एड्स" },
            { id: 24, question: "एचआईवी में किस एंजाइम का उपयोग करके वायरल आरएनए को डीएनए में बदला जाता है?", options: ["रिवर्स ट्रांसक्रिप्टेज","डीएनए लाइगेज","आरएनए पोलीमरेज़","एमिनोएसिल सिंथेटेज"], answer: "रिवर्स ट्रांसक्रिप्टेज", chapter: "एड्स" },
            { id: 25, question: "एड्स का पता लगाने के लिए सामान्यतः कौन सा परीक्षण किया जाता है?", options: ["एलिसा (ELISA)","विडाल टेस्ट","पीसीआर","ब्लड काउंट"], answer: "एलिसा (ELISA)", chapter: "एड्स" },
            { id: 26, question: "एचआईवी का संचारण कैसे होता है?", options: ["यौन संपर्क और संक्रमित रक्त","छींकने और खांसने से","मच्छर के काटने से","पानी पीने से"], answer: "यौन संपर्क और संक्रमित रक्त", chapter: "एड्स" },
            { id: 27, question: "एड्स के रोगी में किसका स्तर कम हो जाता है?", options: ["T4 लिम्फोसाइट्स","B-लिम्फोसाइट्स","एंटीबॉडी","लाल रक्त कोशिकाएं"], answer: "T4 लिम्फोसाइट्स", chapter: "एड्स" },
            { id: 28, question: "एचआईवी एक रेट्रोवायरस क्यों है?", options: ["इसमें आरएनए जीनोम होता है","इसमें डीएनए जीनोम होता है","यह केवल पुरुषों को प्रभावित करता है","इसका कोई जेनेटिक मटेरियल नहीं है"], answer: "इसमें आरएनए जीनोम होता है", chapter: "एड्स" },
            { id: 29, question: "भारत में AIDS नियंत्रण के लिए कौन सी संस्था है?", options: ["NACO (नाको)","WHO","ICMR","AIIMS"], answer: "NACO (नाको)", chapter: "एड्स" },
            { id: 30, question: "एड्स का उपचार किस प्रकार की दवाओं से किया जाता है?", options: ["एंटीरेट्रोवायरल ड्रग्स (ART)","एंटीबायोटिक्स","एनाल्जेसिक","एंटीफंगल"], answer: "एंटीरेट्रोवायरल ड्रग्स (ART)", chapter: "एड्स" },

            // कैंसर (Cancer)
            { id: 31, question: "सामान्य कोशिकाओं का अनियंत्रित विभाजन क्या कहलाता है?", options: ["कैंसर","ट्यूमर","मेटास्टेसिस","प्रोलिफरेशन"], answer: "कैंसर", chapter: "कैंसर" },
            { id: 32, question: "कैंसर के अध्ययन को क्या कहते हैं?", options: ["ऑन्कोलॉजी","बायोलॉजी","हिस्टोलॉजी","साइटोलॉजी"], answer: "ऑन्कोलॉजी", chapter: "कैंसर" },
            { id: 33, question: "सौम्य ट्यूमर (Benign Tumor) की विशेषता क्या है?", options: ["एक ही स्थान पर सीमित रहना","पूरे शरीर में फैलना","तेजी से बढ़ना","अन्य ऊतकों पर आक्रमण करना"], answer: "एक ही स्थान पर सीमित रहना", chapter: "कैंसर" },
            { id: 34, question: "घातक ट्यूमर (Malignant Tumor) का अन्य नाम क्या है?", options: ["नियोप्लाज्म","सिस्ट","एडिमा","अल्सर"], answer: "नियोप्लाज्म", chapter: "कैंसर" },
            { id: 35, question: "कैंसर कोशिकाओं का रक्त के माध्यम से दूर के स्थानों तक फैलना क्या कहलाता है?", options: ["मेटास्टेसिस","इंफ्लेमेशन","जेनेसिस","बायोप्सी"], answer: "मेटास्टेसिस", chapter: "कैंसर" },
            { id: 36, question: "कैंसर पैदा करने वाले कारक (Agents) क्या कहलाते हैं?", options: ["कार्सिनोजेन","पैथोजन","जीन","एलर्जेन"], answer: "कार्सिनोजेन", chapter: "कैंसर" },
            { id: 37, question: "कैंसर के उपचार में उपयोग की जाने वाली विधि क्या है?", options: ["कीमोथेरेपी और रेडियोथेरेपी","एंटीबायोटिक्स","वैक्सीन","एंटीफंगल"], answer: "कीमोथेरेपी और रेडियोथेरेपी", chapter: "कैंसर" },
            { id: 38, question: "कैंसर का कारण बनने वाले जीन क्या कहलाते हैं?", options: ["ऑन्कोजीन (Oncogenes)","सप्रेसर जीन","प्रोटीन जीन","इंसुलिन जीन"], answer: "ऑन्कोजीन (Oncogenes)", chapter: "कैंसर" },

        // --- JavaScript फ़ंक्शंस (रेंडरिंग और चेकिंग लॉजिक) ---
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';
            let currentChapter = '';

            testQuestions.forEach((mcq, index) => {
                // अध्याय के आधार पर हेडिंग जोड़ना
                if (mcq.chapter !== currentChapter) {
                    htmlContent += `<h3>${mcq.chapter.toUpperCase()}</h3>`;
                    currentChapter = mcq.chapter;
                }

                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    const displayOption = option; 

                    htmlContent += `<label><input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${displayOption}</label>`;
                });
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });
            form.innerHTML = htmlContent;
        }

        function checkAnswers(event) {
            if (event) event.preventDefault(); 
            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');
            
            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';

                const correctAnswerDisplay = mcq.answer;

                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                }
            });

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score / totalQuestions >= 0.8 ? 'green' : (score / totalQuestions >= 0.5 ? 'orange' : 'red')}; font-size: 1.2em;">
                    ${score / totalQuestions >= 0.8 ? 'उत्कृष्ट! स्वास्थ्य और रोग पर आपकी पकड़ मजबूत है। 🌟' : (score / totalQuestions >= 0.5 ? 'अच्छा प्रयास। मुख्य अवधारणाओं पर अधिक ध्यान दें।' : 'सिद्धांतों को फिर से दोहराएं।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;
            window.scrollTo(0, 0);
        }

        window.onload = renderTest;

    </script>
