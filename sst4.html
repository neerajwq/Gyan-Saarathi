    <script>
        // --- 100 MCQs का डेटा सरणी ---
        const testQuestions = [
            // अध्याय 1: यूरोप में राष्ट्रवाद का उदय (5 Qs)
            { id: 1, question: "यंग इटली (Young Italy) नामक गुप्त भूमिगत समाज का गठन किसने किया?", options: ["कैवूर", "जूसेपे मेत्सिनी", "गैरीबाल्डी", "विक्टर इमैनुएल II"], answer: "जूसेपे मेत्सिनी", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "मेत्सिनी ने इटली के एकीकरण के लिए यह क्रांतिकारी संगठन 1831 में स्थापित किया।" },
            { id: 2, question: "जर्मनी के एकीकरण में महत्वपूर्ण भूमिका निभाने वाले प्रशिया के मुख्यमंत्री कौन थे?", options: ["ड्यूक मैटरनिख", "नेपोलियन बोनापार्ट", "ओटो वॉन बिस्मार्क", "लुई फिलिप"], answer: "ओटो वॉन बिस्मार्क", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "बिस्मार्क ने 'रक्त और लौह' की नीति के माध्यम से जर्मनी का एकीकरण किया।" },
            { id: 3, question: "वियना कांग्रेस (Vienna Congress) किस वर्ष आयोजित हुई थी?", options: ["1789", "1804", "1815", "1848"], answer: "1815", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "इसका उद्देश्य नेपोलियन युद्धों के बाद यूरोप में रूढ़िवादी व्यवस्था बहाल करना था।" },
            { id: 4, question: "नेपोलियन युद्धों के दौरान किस क्षेत्र को 'सिविल कोड' या 'नेपोलियन कोड' से सबसे अधिक लाभ हुआ?", options: ["ब्रिटेन", "फ्रांस के नियंत्रण वाले क्षेत्र", "प्रशिया", "रूस"], answer: "फ्रांस के नियंत्रण वाले क्षेत्र", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "इस कोड ने समानता, संपत्ति का अधिकार और सामंती व्यवस्था की समाप्ति की।" },
            { id: 5, question: "'उदार राष्ट्रवाद' (Liberal Nationalism) का क्या अर्थ था?", options: ["राजाओं द्वारा शासन", "धर्म और राजतंत्र का वर्चस्व", "व्यक्ति की स्वतंत्रता और कानून के समक्ष समानता", "सैन्य शासन"], answer: "व्यक्ति की स्वतंत्रता और कानून के समक्ष समानता", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "यह नागरिकों के लिए राजनीतिक स्वतंत्रता और समान अधिकारों पर जोर देता था।" },

            // अध्याय 2: भारत में राष्ट्रवाद (5 Qs)
            { id: 6, question: "'हिंद स्वराज' (Hind Swaraj) पुस्तक में महात्मा गाँधी ने किस बात पर जोर दिया?", options: ["औद्योगीकरण को बढ़ावा", "ब्रिटिश शिक्षा का समर्थन", "स्वशासन और अहिंसा", "सशस्त्र क्रांति"], answer: "स्वशासन और अहिंसा", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "गाँधी ने 1909 में लिखी इस पुस्तक में ब्रिटिश शासन को खत्म करने के लिए अहिंसक असहयोग का तर्क दिया।" },
            { id: 7, question: "पूना पैक्ट (Poona Pact) पर कब हस्ताक्षर किए गए थे?", options: ["1928", "1930", "1932", "1942"], answer: "1932", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "इस पर गाँधी और डॉ. अम्बेडकर ने हस्ताक्षर किए, जिसमें दलित वर्गों के लिए आरक्षित सीटें प्रदान की गईं।" },
            { id: 8, question: "साइमन कमीशन का भारतीयों द्वारा बहिष्कार क्यों किया गया?", options: ["यह केवल ब्रिटिश सेना को बढ़ावा देता था", "इसमें एक भी भारतीय सदस्य नहीं था", "इसने विभाजन की माँग की", "यह नमक कानून से संबंधित था"], answer: "इसमें एक भी भारतीय सदस्य नहीं था", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "यह कमीशन भारत में संवैधानिक सुधारों का अध्ययन करने आया था, लेकिन इसमें कोई भारतीय सदस्य नहीं था।" },
            { id: 9, question: "असहयोग आंदोलन (Non-Cooperation Movement) को किस घटना के कारण वापस ले लिया गया?", options: ["नमक सत्याग्रह", "जलियाँवाला बाग", "चौरी-चौरा की घटना", "साइमन कमीशन का आगमन"], answer: "चौरी-चौरा की घटना", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "1922 में हुई इस हिंसक घटना के कारण गाँधी ने आंदोलन वापस ले लिया।" },
            { id: 10, question: "बारडोली सत्याग्रह (1928) का मुख्य उद्देश्य क्या था?", options: ["भू-राजस्व में वृद्धि का विरोध", "नमक कानून तोड़ना", "कपड़ा मिलों में हड़ताल", "दलितों के लिए आरक्षण"], answer: "भू-राजस्व में वृद्धि का विरोध", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "यह सरदार वल्लभ भाई पटेल के नेतृत्व में किसानों का सफल आंदोलन था।" },

            // अध्याय 3: भूमंडलीकृत विश्व का बनना (5 Qs)
            { id: 11, question: "अंतर्राष्ट्रीय मुद्रा कोष (IMF) और विश्व बैंक (World Bank) की स्थापना किस समझौते के तहत हुई?", options: ["वियना समझौता", "जेनेवा समझौता", "ब्रेटन वुड्स समझौता", "क्योटो प्रोटोकॉल"], answer: "ब्रेटन वुड्स समझौता", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "यह समझौता 1944 में हुआ, जिसका उद्देश्य युद्ध के बाद आर्थिक स्थिरता लाना था।" },
            { id: 12, question: "वह प्रक्रिया जिसके द्वारा लोग एक स्थान से दूसरे स्थान पर जाते हैं (काम या बसने के लिए) उसे क्या कहते हैं?", options: ["व्यापार", "पूंजी प्रवाह", "प्रवासन (Migration)", "वैश्वीकरण"], answer: "प्रवासन (Migration)", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "19वीं सदी में श्रम का प्रवाह प्रमुख था, जिसे प्रवासन कहते हैं।" },
            { id: 13, question: "औपनिवेशिक काल में 'गिरमिटिया मजदूर' (Indentured Labour) कौन होते थे?", options: ["सेना के जवान", "यूरोपीय व्यापारी", "अनुबंध के तहत काम करने वाले श्रमिक", "बागानों के मालिक"], answer: "अनुबंध के तहत काम करने वाले श्रमिक", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "इन्हें एक निश्चित अवधि के लिए काम करने के लिए दूर स्थानों पर ले जाया जाता था।" },
            { id: 14, question: "सिल्क रूट के माध्यम से कौन-सा खाद्य पदार्थ यूरोप पहुँचा, जिससे आलू और टमाटर का प्रचलन बढ़ा?", options: ["चावल", "पास्ता", "सोया", "नूडल्स"], answer: "नूडल्स", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "नूडल्स चीन से यूरोप गए और वहाँ स्पेगेटी के रूप में विकसित हुए।" },
            { id: 15, question: "पहले विश्व युद्ध के बाद दुनिया में किस धातु की कमी हो गई थी?", options: ["लोहा", "सोना", "चाँदी", "तांबा"], answer: "सोना", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "युद्ध के दौरान सोने के निर्यात पर प्रतिबंध लगा दिया गया था, जिससे सोने के मानक में अस्थिरता आई।" },

            // अध्याय 4: औद्योगीकरण का युगकरण (5 Qs)
            { id: 16, question: "औद्योगीकरण के शुरुआती दौर में अधिकांश आविष्कार किस उद्योग से संबंधित थे?", options: ["रेलवे", "लोहा और इस्पात", "वस्त्र (Textiles)", "विद्युत"], answer: "वस्त्र (Textiles)", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "जैसे- स्पिंगनिंग जेनी, फ्लाइंग शटल आदि।" },
            { id: 17, question: "भाप इंजन (Steam Engine) का आविष्कार किसने किया और उसमें सुधार किसने किया?", options: ["थॉमस न्यूकोमेन और जेम्स वॉट", "हेनरी फोर्ड और जॉन के", "आर्कराइट और सैमुअल क्रॉम्पटन", "जेम्स हरग्रीव्स और जेम्स वॉट"], answer: "थॉमस न्यूकोमेन और जेम्स वॉट", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "न्यूकोमेन ने 1712 में इंजन बनाया, और जेम्स वॉट ने 1781 में इसे पेटेंट कराया और सुधार किया।" },
            { id: 18, question: "19वीं शताब्दी के अंत में भारतीय बाज़ारों में मैनचेस्टर के उत्पादों पर कौन-सी छवि दिखाई देती थी?", options: ["भारतीय राजाओं की तस्वीरें", "कृष्ण या गणेश की तस्वीरें", "बुनकरों की तस्वीरें", "ब्रिटिश राजनेताओं की तस्वीरें"], answer: "कृष्ण या गणेश की तस्वीरें", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "उत्पाद बेचने के लिए धार्मिक और शाही प्रतीकों का इस्तेमाल किया गया।" },
            { id: 19, question: "जमशेदजी टाटा द्वारा टाटा आयरन एंड स्टील कंपनी (TISCO) की स्थापना कहाँ की गई?", options: ["बोकारो", "जमशेदपुर", "दुर्गापुर", "भिलाई"], answer: "जमशेदपुर", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "TISCO की स्थापना 1907 में साकची (झारखंड) में हुई, जिसे बाद में जमशेदपुर नाम दिया गया।" },
            { id: 20, question: "ब्रिटेन में काम की तलाश में गाँव से शहर आने वाले लोगों के लिए 'जॉबर' (Jobber) की क्या भूमिका थी?", options: ["कारखाना मालिक", "वित्तीय सलाहकार", "नया कर्मचारी ढूँढना और नौकरी देना", "मशीन ऑपरेटर"], answer: "नया कर्मचारी ढूँढना और नौकरी देना", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "जॉबर कारखाने के पुराने और भरोसेमंद कर्मचारी होते थे जो श्रमिकों की भर्ती करते थे।" },

        // --- JavaScript फ़ंक्शंस (रेंडरिंग और चेकिंग लॉजिक) ---

        // प्रश्नों को HTML में रेंडर करें
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';

            testQuestions.forEach((mcq, index) => {
                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. [${mcq.chapter}] ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    htmlContent += `<label>`;
                    htmlContent += `<input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${option}`;
                    htmlContent += `</label>`;
                });
                
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });

            form.innerHTML = htmlContent;
        }

        // उत्तरों की जाँच करें और स्कोर प्रदर्शित करें
        function checkAnswers(event) {
            if (event) event.preventDefault(); 

            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');

            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';
                
                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                }

                // स्पष्टीकरण जोड़ें
                feedbackDiv.innerHTML += `<div class="explanation">स्पष्टीकरण: ${mcq.explanation}</div>`;
            });

            // परिणाम प्रदर्शित करें
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score >= 80 ? 'green' : (score >= 50 ? 'orange' : 'red')}; font-size: 1.5em;">
                    ${score >= 80 ? 'चौथी टेस्ट श्रृंखला में भी बेहतरीन प्रदर्शन! आपकी तैयारी बहुत मजबूत है! 💪' : (score >= 50 ? 'बहुत अच्छा प्रयास। अब उन विषयों पर ध्यान दें जहाँ गलतियाँ हुई हैं।' : 'यह अभ्यास महत्वपूर्ण है। कृपया अपनी पाठ्यपुस्तकों को गहराई से पढ़ें।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;

            window.scrollTo(0, 0);
        }

        // पेज लोड होने पर टेस्ट प्रदर्शित करें
        window.onload = renderTest;

    </script>

</body>
</html>
