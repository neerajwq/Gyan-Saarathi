            { id: 91, question: "तापमान बढ़ाने पर, जल में कौन सी गैस अधिक घुलनशील हो जाती है?", options: ["कोई नहीं","ऑक्सीजन","कार्बन डाइऑक्साइड","हीलियम"], answer: "कोई नहीं", chapter: "भौतिक रसायन" },

            { id: 93, question: "कौन सा कार्बोहाइड्रेट अपचायक शर्करा (Reducing Sugar) नहीं है?", options: ["सुक्रोज (Sucrose)","ग्लूकोज","फ्रक्टोज","माल्टोज"], answer: "सुक्रोज (Sucrose)", chapter: "कार्बनिक रसायन" },

            { id: 96, question: "हैलोजन अणुओं में वियोजन ऊर्जा (Dissociation Energy) का क्रम क्या है?", options: ["$$\mathrm{Cl_2 > Br_2 > F_2 > I_2}$$","$$\mathrm{F_2 > Cl_2 > Br_2 > I_2}$$","$$\mathrm{I_2 > Br_2 > Cl_2 > F_2}$$","$$\mathrm{Br_2 > I_2 > Cl_2 > F_2}$$"], answer: "$$\mathrm{Cl_2 > Br_2 > F_2 > I_2}$$", chapter: "अकार्बनिक रसायन" },
            { id: 97, question: "विटामिन $$B_1$$ का रासायनिक नाम क्या है?", options: ["थायमिन (Thiamine)","राइबोफ्लेविन","पाइरिडॉक्सिन","एस्कॉर्बिक अम्ल"], answer: "थायमिन (Thiamine)", chapter: "कार्बनिक रसायन" },
            { id: 98, question: "नॉन-स्टीरियोकेमिकल उपसहसंयोजक यौगिक का उदाहरण क्या है?", options: ["$$cis$$/$$trans$$ समावयव","ज्यामितीय समावयव","प्रकाशिक समावयव","आयनीकरण समावयव"], answer: "आयनीकरण समावयव", chapter: "अकार्बनिक रसायन" },
            { id: 99, question: "कौन सा बहुलक बायोडिग्रेडेबल (Biodegradable) नहीं है?", options: ["पॉलीथीन (Polythene)","PHBV","डेक्सट्रॉन","नायलॉन-2-नायलॉन-6"], answer: "पॉलीथीन (Polythene)", chapter: "अन्य" },
            { id: 100, question: "कार्बोक्सिलिक अम्लों की अम्लीय प्रबलता को कौन सा कारक बढ़ाता है?", options: ["इलेक्ट्रॉन खींचने वाले समूह का जुड़ना","इलेक्ट्रॉन दान करने वाले समूह का जुड़ना","बड़ा ऐल्किल समूह","पानी का तापमान"], answer: "इलेक्ट्रॉन खींचने वाले समूह का जुड़ना", chapter: "कार्बनिक रसायन" }
        ];

        // --- JavaScript फ़ंक्शंस (रेंडरिंग और चेकिंग लॉजिक) ---
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';
            let currentChapter = '';

            testQuestions.forEach((mcq, index) => {
                // अध्याय के आधार पर हेडिंग जोड़ना
                if (mcq.chapter !== currentChapter) {
                    let unitTitle = '';
                    if (mcq.chapter === 'भौतिक रसायन') unitTitle = 'इकाई I: भौतिक रसायन (विलयन, इलेक्ट्रो, बलगतिकी, पृष्ठ)';
                    else if (mcq.chapter === 'अकार्बनिक रसायन') unitTitle = 'इकाई II: अकार्बनिक रसायन (D & F ब्लॉक, उपसहसंयोजक, P-ब्लॉक)';
                    else if (mcq.chapter === 'कार्बनिक रसायन') unitTitle = 'इकाई III: कार्बनिक रसायन (ऐल्कोहॉल, ऐल्डिहाइड, ऐमीन, जैव-अणु)';
                    else if (mcq.chapter === 'अन्य') unitTitle = 'इकाई IV: बहुलक और दैनिक जीवन में रसायन';
                    
                    htmlContent += `<h3>${unitTitle}</h3>`;
                    currentChapter = mcq.chapter;
                }

                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    // LaTeX rendering logic (simplified)
                    const displayOption = option
                        .replace(/\$\$([\s\S]*?)\$\$/g, (match, p1) => {
                            return p1.replace(/H_2O/g, 'H<sub>2</sub>O')
                                    .replace(/Mn^{2+}/g, 'Mn<sup>2+</sup>')
                                    .replace(/Zr/g, 'Zr').replace(/Hf/g, 'Hf')
                                    .replace(/Co(NH_3)_6/g, 'Co(NH<sub>3</sub>)<sub>6</sub>')
                                    .replace(/NH_3/g, 'NH<sub>3</sub>').replace(/H_2O/g, 'H<sub>2</sub>O')
                                    .replace(/Cl_2 > Br_2 > F_2 > I_2/g, 'Cl<sub>2</sub> > Br<sub>2</sub> > F<sub>2</sub> > I<sub>2</sub>')
                                    .replace(/ln \frac{[R]_0}{[R]} = kt/g, 'ln [R]<sub>0</sub>/[R] = kt')
                                    .replace(/1}{[R]} - \frac{1}{[R]_0} = kt/g, '1/[R] - 1/[R]<sub>0</sub> = kt')
                                    .replace(/[R]_0 - [R] = kt/g, '[R]<sub>0</sub> - [R] = kt')
                                    .replace(/ln [R] = ln [R]_0 + kt/g, 'ln [R] = ln [R]<sub>0</sub> + kt')
                                    .replace(/mol L^{-1} s^{-1}/g, 'mol L<sup>-1</sup> s<sup>-1</sup>')
                                    .replace(/s^{-1}/g, 's<sup>-1</sup>')
                                    .replace(/L mol^{-1} s^{-1}/g, 'L mol<sup>-1</sup> s<sup>-1</sup>')
                                    .replace(/L^2 mol^{-2} s^{-1}/g, 'L<sup>2</sup> mol<sup>-2</sup> s<sup>-1</sup>')
                                    .replace(/Cr_2O_7/g, 'Cr<sub>2</sub>O<sub>7</sub>')
                                    .replace(/Cr^{3+}/g, 'Cr<sup>3+</sup>')
                                    .replace(/XeF_2/g, 'XeF<sub>2</sub>')
                                    .replace(/XeO_3/g, 'XeO<sub>3</sub>')
                                    .replace(/XeF_6/g, 'XeF<sub>6</sub>')
                                    .replace(/XeO_4/g, 'XeO<sub>4</sub>')
                                    .replace(/MnO_4/g, 'MnO<sub>4</sub>')
                                    .replace(/CF_3COOH/g, 'CF<sub>3</sub>COOH')
                                    .replace(/CCl_3COOH/g, 'CCl<sub>3</sub>COOH')
                                    .replace(/CH_3COOH/g, 'CH<sub>3</sub>COOH')
                                    .replace(/C_6H_5COOH/g, 'C<sub>6</sub>H<sub>5</sub>COOH')
                                    .replace(/NaNO_2/g, 'NaNO<sub>2</sub>')
                                    .replace(/HCl/g, 'HCl')
                                    .replace(/KMnO_4/g, 'KMnO<sub>4</sub>')
                                    .replace(/NaOH/g, 'NaOH')
                                    .replace(/H_2SO_4/g, 'H<sub>2</sub>SO<sub>4</sub>')
                                    .replace(/KClO_3/g, 'KClO<sub>3</sub>')
                                    .replace(/MnO_2/g, 'MnO<sub>2</sub>')
                                    .replace(/1^\circ, 2^\circ, \text{और}\ 3^\circ/g, '1&deg;, 2&deg;, और 3&deg;')
                                    .replace(/3^\circ/g, '3&deg;')
                                    .replace(/1^\circ/g, '1&deg;')
                                    .replace(/2^\circ/g, '2&deg;')
                                    .replace(/R-CONH_2/g, 'R-CONH<sub>2</sub>')
                                    .replace(/R-NH_2/g, 'R-NH<sub>2</sub>')
                                    .replace(/cis\/trans/g, 'cis/trans')
                                    .replace(/R-X/g, 'R-X')
                                    .replace(/Zn^{2+}/g, 'Zn<sup>2+</sup>');
                        });
                    
                    htmlContent += `<label><input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${displayOption}</label>`;
                });
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });
            form.innerHTML = htmlContent;
        }

        function checkAnswers(event) {
            if (event) event.preventDefault(); 
            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');
            
            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';

                const correctAnswerDisplay = mcq.answer
                    .replace(/\$\$([\s\S]*?)\$\$/g, (match, p1) => {
                        return p1.replace(/H_2O/g, 'H<sub>2</sub>O')
                                    .replace(/Mn^{2+}/g, 'Mn<sup>2+</sup>')
                                    .replace(/Zr/g, 'Zr').replace(/Hf/g, 'Hf')
                                    .replace(/Cl_2 > Br_2 > F_2 > I_2/g, 'Cl<sub>2</sub> > Br<sub>2</sub> > F<sub>2</sub> > I<sub>2</sub>')
                                    .replace(/ln \frac{[R]_0}{[R]} = kt/g, 'ln [R]<sub>0</sub>/[R] = kt')
                                    .replace(/mol L^{-1} s^{-1}/g, 'mol L<sup>-1</sup> s<sup>-1</sup>')
                                    .replace(/Cr^{3+}/g, 'Cr<sup>3+</sup>')
                                    .replace(/XeF_2/g, 'XeF<sub>2</sub>')
                                    .replace(/MnO_4/g, 'MnO<sub>4</sub>')
                                    .replace(/CF_3COOH/g, 'CF<sub>3</sub>COOH')
                                    .replace(/NaNO_2/g, 'NaNO<sub>2</sub>')
                                    .replace(/HCl/g, 'HCl')
                                    .replace(/KClO_3/g, 'KClO<sub>3</sub>')
                                    .replace(/MnO_2/g, 'MnO<sub>2</sub>')
                                    .replace(/1^\circ, 2^\circ, \text{और}\ 3^\circ/g, '1&deg;, 2&deg;, और 3&deg;')
                                    .replace(/3^\circ/g, '3&deg;')
                                    .replace(/R-CONH_2/g, 'R-CONH<sub>2</sub>')
                                    .replace(/R-NH_2/g, 'R-NH<sub>2</sub>')
                                    .replace(/Zn^{2+}/g, 'Zn<sup>2+</sup>');
                    });

                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                }
            });

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score / totalQuestions >= 0.8 ? 'green' : (score / totalQuestions >= 0.5 ? 'orange' : 'red')}; font-size: 1.2em;">
                    ${score / totalQuestions >= 0.8 ? 'शानदार! आपकी तैयारी बेहतरीन है। 💯' : (score / totalQuestions >= 0.5 ? 'अच्छा प्रदर्शन। कुछ और अभ्यास की आवश्यकता है।' : 'सिद्धांतों को फिर से दोहराएं। मुख्य अवधारणाओं पर ध्यान दें।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;
            window.scrollTo(0, 0);
        }

        window.onload = renderTest;

    </script>

</body>
