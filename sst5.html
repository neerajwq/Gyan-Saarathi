    <script>
        // --- 100 MCQs का डेटा सरणी ---
        const testQuestions = [
            // अध्याय 1: यूरोप में राष्ट्रवाद का उदय (5 Qs)
            { id: 1, question: "यूनान को एक स्वतंत्र राष्ट्र के रूप में मान्यता किस संधि द्वारा मिली?", options: ["वियना संधि", "कुस्तुंतुनिया की संधि (1832)", "फ्रैंकफर्ट की संधि", "नेपल्स संधि"], answer: "कुस्तुंतुनिया की संधि (1832)", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "1832 में कुस्तुंतुनिया की संधि ने यूनान को एक स्वतंत्र राष्ट्र के रूप में मान्यता दी।" },
            { id: 2, question: "जर्मनी में 'जोलवेरिन' (Zollverein) का मुख्य उद्देश्य क्या था?", options: ["सैनिक संगठन", "व्यापार संघ", "शुल्क संघ (Customs Union)", "राजनीतिक दल"], answer: "शुल्क संघ (Customs Union)", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "यह 1834 में प्रशिया की पहल पर बना था, जिसने शुल्क बाधाओं को समाप्त किया।" },
            { id: 3, question: "किस जर्मन दार्शनिक ने दावा किया कि सच्चा जर्मन संस्कृति आम लोगों (Das Volk) के बीच पाया जाता है?", options: ["जूसेपे मेत्सिनी", "योहान गॉटफ्रीड हर्डर", "ओटो वॉन बिस्मार्क", "ड्यूक मैटरनिख"], answer: "योहान गॉटफ्रीड हर्डर", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "हर्डर ने राष्ट्र की सच्ची भावना को लोकगीतों और लोकनृत्यों (Volksgeist) में पाया।" },
            { id: 4, question: "'कार्बोनारी' (Carbonari) क्या था?", options: ["यूरोप का व्यापारिक संघ", "जर्मनी का किसान संगठन", "इटली में क्रांतिकारियों का एक गुप्त समाज", "एक कपड़ा मिल"], answer: "इटली में क्रांतिकारियों का एक गुप्त समाज", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "मेत्सिनी कार्बोनारी का सदस्य था।" },
            { id: 5, question: "फ्रांसीसी क्रांति के दौरान राष्ट्रीय भावना को मजबूत करने के लिए कौन-सा विचार शुरू किया गया?", options: ["राजतंत्र की बहाली", "ला पैट्रि (La Patrie) और ले सिटॉयन (Le Citoyen)", "नेपोलियन का कोड", "सामंती व्यवस्था का विस्तार"], answer: "ला पैट्रि (La Patrie) और ले सिटॉयन (Le Citoyen)", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "इसका अर्थ है 'पितृभूमि' और 'नागरिक', जिसने संयुक्त समुदाय के विचार पर जोर दिया।" },

            // अध्याय 2: भारत में राष्ट्रवाद (5 Qs)
            { id: 6, question: "साइमन कमीशन का गठन क्यों किया गया था?", options: ["भारत के विभाजन पर चर्चा करना", "ब्रिटिश सरकार की ओर से सैन्य सहायता भेजना", "भारत में संवैधानिक प्रणाली के कामकाज की समीक्षा करना", "कांग्रेस पार्टी पर प्रतिबंध लगाना"], answer: "भारत में संवैधानिक प्रणाली के कामकाज की समीक्षा करना", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "इसका गठन 1927 में भारत सरकार अधिनियम, 1919 के तहत किया गया था।" },
            { id: 7, question: "नमक यात्रा (दांडी मार्च) कब शुरू हुई?", options: ["1928", "1929", "1930", "1932"], answer: "1930", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "गाँधी ने 12 मार्च 1930 को साबरमती से दांडी तक मार्च किया।" },
            { id: 8, question: "सत्याग्रह के विचार में, महात्मा गाँधी ने किस पर जोर दिया?", options: ["हथियार उठाना", "केवल बल का उपयोग", "सत्य की शक्ति और अहिंसा", "अंग्रेजों के साथ पूर्ण सहयोग"], answer: "सत्य की शक्ति और अहिंसा", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "सत्याग्रह का अर्थ है सत्य और अहिंसा के माध्यम से अन्याय के खिलाफ लड़ना।" },
            { id: 9, question: "रोलेट एक्ट (Rowlatt Act) किस वर्ष पारित हुआ?", options: ["1918", "1919", "1920", "1921"], answer: "1919", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "इसने सरकार को राजनीतिक गतिविधियों को दबाने और बिना मुकदमे के राजनीतिक कैदियों को दो साल तक हिरासत में रखने का अधिकार दिया।" },
            { id: 10, question: "डॉ. बी.आर. अम्बेडकर ने 1930 में किस संगठन की स्थापना की?", options: ["कांग्रेस पार्टी", "डिप्रेस्ड क्लास एसोसिएशन (दबाए गए वर्गों का संघ)", "खिलाफत समिति", "किसान सभा"], answer: "डिप्रेस्ड क्लास एसोसिएशन (दबाए गए वर्गों का संघ)", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "इसका उद्देश्य दलित समुदायों के अधिकारों के लिए लड़ना था।" },

            // अध्याय 3: भूमंडलीकृत विश्व का बनना (5 Qs)
            { id: 11, question: "वे वस्तुएँ या सेवाएँ जो एक देश से दूसरे देश में बेची जाती हैं, उन्हें क्या कहते हैं?", options: ["निवेश", "आयात", "निर्यात", "प्रवाह"], answer: "निर्यात", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "निर्यात किसी देश द्वारा अन्य देशों को बेची जाने वाली वस्तुएँ हैं।" },
            { id: 12, question: "19वीं सदी में, भारत से गिरमिटिया श्रमिकों को किस स्थान पर नहीं भेजा गया?", options: ["फिजी", "गुयाना", "मॉरीशस", "संयुक्त राज्य अमेरिका"], answer: "संयुक्त राज्य अमेरिका", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "उन्हें कैरिबियाई द्वीप समूह, फिजी और मॉरीशस जैसे स्थानों पर भेजा गया।" },
            { id: 13, question: "जर्मनी, इटली और जापान द्वारा द्वितीय विश्व युद्ध के दौरान बनाए गए गठबंधन को क्या कहा जाता था?", options: ["मित्र राष्ट्र", "धुरी शक्तियाँ (Axis Powers)", "गुट निरपेक्ष राष्ट्र", "सप्त शक्तियों का समूह"], answer: "धुरी शक्तियाँ (Axis Powers)", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "धुरी शक्तियाँ मित्र राष्ट्रों (ब्रिटेन, फ्रांस, यूएसए, सोवियत संघ) के खिलाफ थीं।" },
            { id: 14, question: "किस देश ने अपने सोने के भंडार के कारण 'सोने का मानक' (Gold Standard) प्रणाली का नेतृत्व किया?", options: ["जर्मनी", "ब्रिटेन", "रूस", "भारत"], answer: "ब्रिटेन", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "ब्रिटेन ने लंबे समय तक सोने के मानक का नेतृत्व किया।" },
            { id: 15, question: "मंदी (Depression) के दौरान कृषि उत्पादों की मांग कम होने पर क्या परिणाम होता है?", options: ["कीमतों में वृद्धि", "कीमतों में गिरावट", "उत्पादन में वृद्धि", "बेरोजगारी में कमी"], answer: "कीमतों में गिरावट", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "मांग में गिरावट से कीमतों में तेज गिरावट आती है, जिससे किसानों को अधिक नुकसान होता है।" },

            // अध्याय 4: औद्योगीकरण का युगकरण (5 Qs)
            { id: 16, question: "ब्रिटेन की औद्योगिक क्रांति के दौरान 'कॉर्डर्स' और 'फुलर' कौन थे?", options: ["कपड़ा मिल के मालिक", "कपड़े को खींचने (Carding) और समेटने (Fulling) में शामिल श्रमिक", "जहाज निर्माण उद्योग के श्रमिक", "खनन विशेषज्ञ"], answer: "कपड़े को खींचने (Carding) और समेटने (Fulling) में शामिल श्रमिक", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "कॉर्डर ऊन को खींचते थे और फुलर कपड़े को समेटते थे।" },
            { id: 17, question: "बंबई (Mumbai) में पहली सफल सूती वस्त्र मिल कब स्थापित हुई?", options: ["1854", "1874", "1905", "1920"], answer: "1854", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "यह कावसजी नानाभाई डावर द्वारा स्थापित की गई थी।" },
            { id: 18, question: "ईस्ट इंडिया कंपनी ने भारतीय बुनकरों पर नियंत्रण करने के लिए किसे नियुक्त किया?", options: ["जॉबर", "सेठ", "गुमाश्ता", "पट्टा"], answer: "गुमाश्ता", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "गुमाश्ता कंपनी के एजेंट थे जो बुनकरों की निगरानी करते थे।" },
            { id: 19, question: "19वीं सदी के मध्य में भारतीय कारखानों में महिलाएँ किस काम के लिए मुख्य रूप से कार्यरत थीं?", options: ["केवल कताई और बुनाई", "जॉबर का काम", "सिलाई और कढ़ाई", "कपास को साफ़ करने (Ginning) और दबाने (Pressing) के काम"], answer: "कपास को साफ़ करने (Ginning) और दबाने (Pressing) के काम", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "इस काम में महिलाओं को भारी संख्या में लगाया जाता था।" },
            { id: 20, question: "कलकत्ता में पहली जूट मिल कब स्थापित हुई?", options: ["1850", "1855", "1860", "1870"], answer: "1855", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "यह रिशरा, कलकत्ता के पास स्थापित हुई थी।" },

            // अध्याय 5: मुद्रण संस्कृति एवं आधुनिक विश्व (5 Qs)
            { id: 21, question: "ईसाई मिशनरियों ने किस भारतीय भाषा में अपना पहला मुद्रित पाठ प्रकाशित किया?", options: ["बंगाली", "तमिल", "मराठी", "संस्कृत"], answer: "तमिल", chapter: "इतिहास: मुद्रण संस्कृति", explanation: "जेसुइट पुजारियों ने 1579 में तमिल में पहली पुस्तक छापी थी।" },
            { id: 22, question: "मुद्रण क्रांति के कारण यूरोप में ज्ञान के किस क्षेत्र में परिवर्तन आया?", options: ["साहित्य और कला", "धर्म और विज्ञान", "राजनीति और धर्म", "उपरोक्त सभी"], answer: "उपरोक्त सभी", chapter: "इतिहास: मुद्रण संस्कृति", explanation: "मुद्रण ने विचारों के प्रसार से सभी क्षेत्रों को प्रभावित किया।" },
            { id: 23, question: "राजा राम मोहन राय ने 1821 में कौन-सा फारसी अखबार शुरू किया?", options: ["केसरी", "संवाद कौमुदी", "मीरात-उल-अखबार", "जाम-ए-जहाँ नुमा"], answer: "मीरात-उल-अखबार", chapter: "इतिहास: मुद्रण संस्कृति", explanation: "उन्होंने फारसी भाषा में यह अखबार शुरू किया था।" },

        // प्रश्नों को HTML में रेंडर करें
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';

            testQuestions.forEach((mcq, index) => {
                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. [${mcq.chapter}] ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    htmlContent += `<label>`;
                    htmlContent += `<input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${option}`;
                    htmlContent += `</label>`;
                });
                
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });

            form.innerHTML = htmlContent;
        }

                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';
                
                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                }

                // स्पष्टीकरण जोड़ें
                feedbackDiv.innerHTML += `<div class="explanation">स्पष्टीकरण: ${mcq.explanation}</div>`;
            });

            // परिणाम प्रदर्शित करें
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score >= 80 ? 'green' : (score >= 50 ? 'orange' : 'red')}; font-size: 1.5em;">
                    ${score >= 80 ? 'शानदार! यह आपका पाँचवा सेट है, और आपकी तैयारी बेहतरीन है! 🏆' : (score >= 50 ? 'अच्छा प्रदर्शन। अब उन विषयों को प्राथमिकता दें जिनमें सुधार की गुंजाइश है।' : 'अपनी तैयारी को और मजबूत करने के लिए पाठ्यपुस्तकों का अधिक अध्ययन करें।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;

            window.scrollTo(0, 0);
        }

        // पेज लोड होने पर टेस्ट प्रदर्शित करें
        window.onload = renderTest;

    </script>

</body>
</html>
