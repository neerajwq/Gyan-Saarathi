    <script>
        // --- 100 MCQs का डेटा सरणी ---
        const testQuestions = [
            // इतिहास (History) - भाग 1: घटनाएँ और प्रक्रियाएँ
            // अध्याय 1: यूरोप में राष्ट्रवाद का उदय (5 Qs)
            { id: 1, question: "फ्रांसीसी दार्शनिक अर्नेस्ट रेनन ने राष्ट्र की क्या परिभाषा दी?", options: ["समान भाषा वाले लोगों का समूह", "एक राजा द्वारा शासित क्षेत्र", "एक दैनिक जनमत संग्रह", "समान धर्म का समूह"], answer: "एक दैनिक जनमत संग्रह", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "रेनन के अनुसार, राष्ट्र साझा अतीत और वर्तमान प्रयासों, बलिदानों तथा निष्ठा का परिणाम है, जो एक दैनिक जनमत संग्रह के रूप में कार्य करता है।" },
            { id: 2, question: "1848 में जर्मन नेशनल असेंबली किस शहर में आयोजित की गई थी?", options: ["बर्लिन", "फ्रैंकफर्ट", "वियना", "लीपज़िग"], answer: "फ्रैंकफर्ट", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "यह असेंबली फ्रैंकफर्ट पार्लियामेंट के नाम से जानी जाती है, जिसका लक्ष्य एकीकृत जर्मन राष्ट्र का निर्माण करना था।" },
            { id: 3, question: "रक्त और लौह (Blood and Iron) की नीति किसके द्वारा अपनाई गई थी?", options: ["कैवूर", "मैत्सिनी", "ओटो वॉन बिस्मार्क", "विक्टर इमैनुएल II"], answer: "ओटो वॉन बिस्मार्क", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "बिस्मार्क ने जर्मनी के एकीकरण के लिए सैन्य शक्ति के उपयोग का समर्थन किया।" },
            { id: 4, question: "यूरोपीय रूढ़िवादी (Conservatism) किस विचार में विश्वास नहीं रखते थे?", options: ["राजतंत्र की बहाली", "चर्च का महत्व", "आलोचना और असहमति की स्वतंत्रता", "पारंपरिक संस्थाओं का संरक्षण"], answer: "आलोचना और असहमति की स्वतंत्रता", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "रूढ़िवादी शासनों ने सेंसरशिप कानून लगाए और आलोचना बर्दाश्त नहीं की।" },
            { id: 5, question: "1861 में किसे एकीकृत इटली का राजा घोषित किया गया था?", options: ["कैवूर", "जूसेपे मेत्सिनी", "विक्टर इमैनुएल II", "गैरीबाल्डी"], answer: "विक्टर इमैनुएल II", chapter: "इतिहास: यूरोप में राष्ट्रवाद", explanation: "सार्डिनिया-पीडमॉन्ट के राजा विक्टर इमैनुएल II को 1861 में इटली का राजा घोषित किया गया।" },

            // अध्याय 2: भारत में राष्ट्रवाद (5 Qs)
            { id: 6, question: "महात्मा गाँधी ने 'हिंद स्वराज' नामक पुस्तक कब लिखी?", options: ["1909", "1915", "1921", "1930"], answer: "1909", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "गाँधी ने यह पुस्तक 1909 में लंदन से दक्षिण अफ्रीका लौटते समय जहाज में लिखी थी।" },
            { id: 7, question: "खिलाफत आंदोलन का मुख्य उद्देश्य क्या था?", options: ["भारत में मुस्लिम शासन स्थापित करना", "खलीफा की शक्ति की बहाली", "पाकिस्तान की माँग", "भारत में अंग्रेजों का विरोध करना"], answer: "खलीफा की शक्ति की बहाली", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "तुर्की के सुल्तान (खलीफा) की शक्ति बहाल करने के लिए अली भाइयों (मुहम्मद अली और शौकत अली) ने यह आंदोलन शुरू किया था।" },
            { id: 8, question: "सविनय अवज्ञा आंदोलन में किसने भाग नहीं लिया?", options: ["गरीब किसान", "उद्योगपति", "औद्योगिक श्रमिक", "उपरोक्त सभी ने भाग लिया"], answer: "औद्योगिक श्रमिक", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "बंबई को छोड़कर, अधिकांश औद्योगिक श्रमिकों ने इस आंदोलन में सक्रिय रूप से भाग नहीं लिया क्योंकि कांग्रेस उनके मांगों को शामिल करने में संकोच कर रही थी।" },
            { id: 9, question: "साइमन कमीशन भारत कब पहुँचा?", options: ["1927", "1928", "1929", "1930"], answer: "1928", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "कमीशन 1928 में भारत पहुँचा, इसका गठन 1927 में हुआ था।" },
            { id: 10, question: "तिरंगे झंडे में चरखा किसने शामिल किया था?", options: ["सुभाष चंद्र बोस", "जवाहरलाल नेहरू", "महात्मा गाँधी", "सरदार पटेल"], answer: "महात्मा गाँधी", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "गाँधी जी ने 1921 में डिज़ाइन किए गए स्वराज ध्वज के केंद्र में चरखा रखा था।" },

            // इतिहास (History) - भाग 2: आजीविकाएँ, अर्थव्यवस्थाएँ और समाज
            // अध्याय 3: भूमंडलीकृत विश्व का बनना (5 Qs)
            { id: 11, question: "1890 के दशक में 'रिंडरपेस्ट' नामक बीमारी किस महाद्वीप में तेज़ी से फैली?", options: ["एशिया", "उत्तरी अमेरिका", "अफ्रीका", "यूरोप"], answer: "अफ्रीका", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "रिंडरपेस्ट पशुओं की बीमारी थी, जिसने अफ्रीकी अर्थव्यवस्थाओं को तबाह कर दिया और उपनिवेशवाद को बढ़ावा दिया।" },
            { id: 12, question: "पहले विश्व युद्ध के बाद दुनिया में आर्थिक स्थिरता लाने के लिए किन दो संस्थानों की स्थापना की गई थी?", options: ["WTO और UNO", "IMF और विश्व बैंक", "GATT और IMF", "ILO और WTO"], answer: "IMF और विश्व बैंक", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "इन्हें ब्रेटन वुड्स संस्थानों के नाम से जाना जाता है।" },
            { id: 13, question: "भारत से चीन को निर्यात की जाने वाली अफीम का भुगतान करने के लिए अंग्रेज कौन सी वस्तु आयात करते थे?", options: ["चाँदी", "सूती वस्त्र", "चाय", "रेशम"], answer: "चाँदी", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "ब्रिटेन अफीम बेचकर चीन से चांदी प्राप्त करता था।" },
            { id: 14, question: "सबसे पहले वैश्वीकरण (Globalization) शब्द का प्रयोग कब किया गया था?", options: ["1900", "1950", "1970", "1990"], answer: "1970", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "हालांकि वैश्वीकरण की प्रक्रिया सदियों पुरानी है, लेकिन इस शब्द का उपयोग 1970 के दशक में शुरू हुआ।" },
            { id: 15, question: "यूरोप में खाद्य पदार्थों की कीमतों में गिरावट किस कानून के उन्मूलन के बाद आई?", options: ["सिल्क लॉ", "कॉर्न लॉ", "शुगर लॉ", "टैक्स लॉ"], answer: "कॉर्न लॉ", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "कॉर्न लॉ को हटाने के बाद सस्ते अनाज का आयात शुरू हुआ, जिससे कीमतें गिर गईं।" },

            // अध्याय 4: औद्योगीकरण का युगकरण (5 Qs)
            { id: 16, question: "औद्योगीकरण के शुरुआती दौर में अधिकांश आविष्कार किस उद्योग से संबंधित थे?", options: ["लौह और इस्पात", "जहाज निर्माण", "कपास/वस्त्र", "मोटर वाहन"], answer: "कपास/वस्त्र", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "कताई और बुनाई के क्षेत्र में आविष्कार, जैसे स्पिनिंग जेनी और फ्लाइंग शटल, शुरू में हावी थे।" },
            { id: 17, question: "कारखाना प्रणाली (Factory System) के उदय का मुख्य परिणाम क्या था?", options: ["श्रमिकों को घर से काम मिला", "उत्पादन ग्रामीण क्षेत्रों में स्थानांतरित हुआ", "एक छत के नीचे उत्पादन का केंद्रीकरण", "केवल अमीर श्रमिकों को रोजगार मिला"], answer: "एक छत के नीचे उत्पादन का केंद्रीकरण", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "कारखाना प्रणाली ने जटिल मशीनों को एक ही स्थान पर स्थापित किया।" },
            { id: 18, question: "ईस्ट इंडिया कंपनी द्वारा 'गुमाश्ता' को नियुक्त करने का मुख्य उद्देश्य क्या था?", options: ["कपड़ा बुनकरों को ऋण प्रदान करना", "कपड़े की गुणवत्ता की जाँच और आपूर्ति सुनिश्चित करना", "बाज़ार में प्रतिस्पर्धा को बढ़ावा देना", "नए कारखाने स्थापित करना"], answer: "कपड़े की गुणवत्ता की जाँच और आपूर्ति सुनिश्चित करना", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "गुमाश्ता बुनकरों पर निगरानी रखते थे और उनकी आपूर्ति सुनिश्चित करते थे।" },
            { id: 19, question: "ब्रिटेन की औद्योगिक क्रांति के दौरान महिलाओं के लिए सबसे बड़ा खतरा कौन सी मशीन बनी?", options: ["स्टीम इंजन", "फ्लाइंग शटल", "स्पिनिंग जेनी", "प्रेस"], answer: "स्पिनिंग जेनी", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "स्पिनिंग जेनी ने कताई के काम में महिलाओं की मांग कम कर दी, जिससे उन्हें काम गंवाने का डर था।" },
            { id: 20, question: "पहले विश्व युद्ध के दौरान, भारत में औद्योगिक उत्पादन क्यों बढ़ा?", options: ["अंग्रेज चले गए", "ब्रिटिश कारखानों को युद्ध उत्पादन के लिए बदल दिया गया", "सस्ती बिजली की उपलब्धता", "भारतीयों ने स्वदेशी वस्तुओं का बहिष्कार किया"], answer: "ब्रिटिश कारखानों को युद्ध उत्पादन के लिए बदल दिया गया", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "ब्रिटेन अब भारत को माल नहीं भेज पा रहा था, जिससे भारतीय उद्योगों को घरेलू आपूर्ति करने का मौका मिला।" },

                });
                
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });

            form.innerHTML = htmlContent;
        }

        // उत्तरों की जाँच करें और स्कोर प्रदर्शित करें
        function checkAnswers(event) {
            if (event) event.preventDefault(); 

            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');

            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';
                
                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                }

                // स्पष्टीकरण जोड़ें
                feedbackDiv.innerHTML += `<div class="explanation">स्पष्टीकरण: ${mcq.explanation}</div>`;
            });

            // परिणाम प्रदर्शित करें
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score >= 80 ? 'green' : (score >= 50 ? 'orange' : 'red')}; font-size: 1.5em;">
                    ${score >= 80 ? 'तीसरे सेट में भी कमाल! आप परीक्षा के लिए तैयार हैं! ✨' : (score >= 50 ? 'सराहनीय प्रयास। कठिन अध्यायों को दोहराएँ।' : 'विषयों को गहराई से पढ़ने की आवश्यकता है।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;

            window.scrollTo(0, 0);
        }

        // पेज लोड होने पर टेस्ट प्रदर्शित करें
        window.onload = renderTest;

    </script>

</body>
