    <script>

        const testQuestions = [
            // इकाई I: जनन (Reproduction) - (Q1-20)
            { id: 1, question: "अनावृतबीजी (Gymnosperms) में दोहरा निषेचन (Double Fertilisation) क्यों नहीं होता है?", options: ["उनमें अंडाशय नहीं होता","उनमें भ्रूणकोश नहीं होता","उनमें पराग नली अनुपस्थित होती है","वे बीजाणुधारी होते हैं"], answer: "उनमें अंडाशय नहीं होता", chapter: "जनन" },
            { id: 2, question: "आलू में कायिक प्रवर्धन (Vegetative Propagation) किस संरचना द्वारा होता है?", options: ["आँख (Eye)","जड़","पत्ती","राइज़ोम"], answer: "आँख (Eye)", chapter: "जनन" },
            { id: 3, question: "मानव में निषेचन (Fertilisation) कहाँ होता है?", options: ["डिंबवाहिनी नली (Fallopian Tube) के एम्पुलरी-इस्थमिक जंक्शन पर","गर्भाशय","योनि","अंडाशय"], answer: "डिंबवाहिनी नली (Fallopian Tube) के एम्पुलरी-इस्थमिक जंक्शन पर", chapter: "जनन" },
            { id: 4, question: "मानव में प्लेसेंटा (Placenta) का कार्य क्या है?", options: ["भ्रूण को पोषण प्रदान करना और अपशिष्ट हटाना","केवल हार्मोन का उत्पादन करना","अंडे का उत्पादन करना","शुक्राणुओं का भंडारण"], answer: "भ्रूण को पोषण प्रदान करना और अपशिष्ट हटाना", chapter: "जनन" },
            { id: 5, question: "परिवार नियोजन कार्यक्रम (Family Planning Programme) भारत में कब शुरू किया गया?", options: ["1951","1961","1971","1981"], answer: "1951", chapter: "जनन" },
            { id: 6, question: "मासिक धर्म चक्र (Menstrual Cycle) का नियमन करने वाला हार्मोन कौन सा है?", options: ["LH और FSH","केवल एस्ट्रोजन","केवल प्रोजेस्टेरोन","थायरोक्सिन"], answer: "LH और FSH", chapter: "जनन" },
            { id: 7, question: "एक अंडाशय (Ovule) में मादा युग्मकोद्भिद (Female Gametophyte) क्या कहलाता है?", options: ["भ्रूणकोश (Embryo Sac)","अंडाशय","परागकोश","बीजांड"], answer: "भ्रूणकोश (Embryo Sac)", chapter: "जनन" },
            { id: 8, question: "शुक्राणुजनन (Spermatogenesis) की प्रक्रिया कहाँ होती है?", options: ["वृषण (Testes) की शुक्रजनक नलिकाओं में","अंडाशय","अधिवृषण","प्रोस्टेट ग्रंथि"], answer: "वृषण (Testes) की शुक्रजनक नलिकाओं में", chapter: "जनन" },
            { id: 9, question: "जननांगों पर मस्से (Genital Warts) किस यौन संचारित रोग (STD) का लक्षण है?", options: ["जननांग हर्पीस (Genital Herpes)","गोनोरिया","सिफलिस","HPV संक्रमण"], answer: "HPV संक्रमण", chapter: "जनन" },
            { id: 10, question: "जल परागण (Hydrophily) किस पौधे में होता है?", options: ["वेलिसनेरिया (Vallisneria)","गुलाब","मटर","मक्का"], answer: "वेलिसनेरिया (Vallisneria)", chapter: "जनन" },

            { id: 12, question: "जनसंख्या विस्फोट (Population Explosion) का कारण क्या है?", options: ["मृत्यु दर में कमी","जन्म दर में कमी","केवल जन्म दर में वृद्धि","केवल मृत्यु दर में वृद्धि"], answer: "मृत्यु दर में कमी", chapter: "जनन" },
            { id: 13, question: "वह संवर्धन माध्यम (Culture Medium) जिसका उपयोग युग्मक अंतर फैलोपियन स्थानांतरण (GIFT) में होता है?", options: ["फैलोपियन नली (Fallopian Tube)","गर्भाशय","इन विट्रो कल्चर प्लेट","योनि"], answer: "फैलोपियन नली (Fallopian Tube)", chapter: "जनन" },
            { id: 14, question: "परागकण (Pollen Grain) की बाहरी परत क्या कहलाती है?", options: ["एग्जाइन (Exine)","इनटाइन","पराग पुटी","बीजाणु"], answer: "एग्जाइन (Exine)", chapter: "जनन" },
            { id: 15, question: "कोरियोनिक विली (Chorionic Villi) और गर्भाशय ऊतक मिलकर क्या बनाते हैं?", options: ["प्लेसेंटा","भ्रूणकोश","अंडवाहिनी","शुक्रवाहिका"], answer: "प्लेसेंटा", chapter: "जनन" },
            { id: 16, question: "एककोशिकीय जीवों में जनन का सबसे सामान्य तरीका क्या है?", options: ["विखंडन (Fission)","लैंगिक जनन","मुकुलन","खंडन"], answer: "विखंडन (Fission)", chapter: "जनन" },
            { id: 17, question: "वृषण (Testis) में कौन सी कोशिकाएँ एंड्रोजन (Androgen) हार्मोन स्रावित करती हैं?", options: ["लेडिग कोशिकाएँ (Leydig Cells)","सर्टोली कोशिकाएँ","शुक्रजनक कोशिकाएँ","जनन कोशिकाएँ"], answer: "लेडिग कोशिकाएँ (Leydig Cells)", chapter: "जनन" },
            { id: 18, question: "अंडोत्सर्ग (Ovulation) किस हार्मोन के उच्च स्तर से प्रेरित होता है?", options: ["LH सर्ज","FSH","एस्ट्रोजन","प्रोजेस्टेरोन"], answer: "LH सर्ज", chapter: "जनन" },
            { id: 19, question: "बीज (Seed) का निर्माण किसके बिना हो सकता है?", options: ["निषेचन (Fertilisation)","परागण","युग्मक","परागनली"], answer: "निषेचन (Fertilisation)", chapter: "जनन" },
            { id: 20, question: "सर्जिकल गर्भनिरोधक (Surgical Contraceptive) का पुरुष रूप क्या है?", options: ["वैसेक्टोमी (Vasectomy)","ट्यूबेक्टोमी","कंडोम","IUD"], answer: "वैसेक्टोमी (Vasectomy)", chapter: "जनन" },

            // इकाई II: आनुवंशिकी और विकास (Genetics and Evolution) - (Q21-45)
            { id: 21, question: "मानव में 'X-सहलग्न अप्रभावी विकार' का उदाहरण क्या है?", options: ["हीमोफीलिया","डाउन सिंड्रोम","फिनाइलकेटोनूरिया","सिकल सेल एनीमिया"], answer: "हीमोफीलिया", chapter: "आनुवंशिकी और विकास" },
            { id: 22, question: "डीएनए से mRNA बनने की प्रक्रिया क्या कहलाती है?", options: ["प्रतिलेखन (Transcription)","प्रतिलिपीकरण","अनुवादन","उत्परिवर्तन"], answer: "प्रतिलेखन (Transcription)", chapter: "आनुवंशिकी और विकास" },
            { id: 23, question: "कोशिका में प्रोटीन संश्लेषण का स्थल कहाँ है?", options: ["राइबोसोम","केंद्रक","माइटोकॉन्ड्रिया","लाइसोसोम"], answer: "राइबोसोम", chapter: "आनुवंशिकी और विकास" },
            { id: 24, question: "मानव जीनोम परियोजना (Human Genome Project) में कुल कितने जीन पाए जाने का अनुमान था?", options: ["लगभग 30,000","लगभग 3,000","लगभग 1,00,000","लगभग 10,000"], answer: "लगभग 30,000", chapter: "आनुवंशिकी और विकास" },
            { id: 25, question: "टिड्डी (Grasshopper) में किस प्रकार का लिंग निर्धारण तंत्र पाया जाता है?", options: ["XX-XO","XX-XY","ZZ-ZW","हेप्लो-डिप्लोइडी"], answer: "XX-XO", chapter: "आनुवंशिकी और विकास" },
            { id: 26, question: "ओपेरॉन मॉडल (Operon Model) को किसने प्रस्तावित किया?", options: ["जैकब और मोनोड","वाटसन और क्रिक","मॉर्गन","मेंडल"], answer: "जैकब और मोनोड", chapter: "आनुवंशिकी और विकास" },
            { id: 27, question: "डार्विन के अनुसार विकास का मुख्य तंत्र क्या है?", options: ["प्राकृतिक चयन (Natural Selection)","उपार्जित लक्षणों की वंशागति","उत्परिवर्तन","पुनर्संयोजन"], answer: "प्राकृतिक चयन (Natural Selection)", chapter: "आनुवंशिकी और विकास" },

            { id: 29, question: "डीएनए फिंगरप्रिंटिंग (DNA Fingerprinting) का विकास किसने किया?", options: ["एलेक जेफ्रीस (Alec Jeffreys)","वाटसन और क्रिक","हरगोविंद खुराना","डॉ. एम.एस. स्वामीनाथन"], answer: "एलेक जेफ्रीस (Alec Jeffreys)", chapter: "आनुवंशिकी और विकास" },
            { id: 30, question: "लैंगिग जनन के दौरान विविधता (Variation) का स्रोत क्या है?", options: ["क्रॉसिंग ओवर (Crossing Over)","उत्परिवर्तन","जीन प्रवाह","सभी विकल्प"], answer: "सभी विकल्प", chapter: "आनुवंशिकी और विकास" },

        // --- JavaScript फ़ंक्शंस (रेंडरिंग और चेकिंग लॉजिक) ---
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';
            let currentChapter = '';

            testQuestions.forEach((mcq, index) => {
                // अध्याय के आधार पर हेडिंग जोड़ना (प्रमुख इकाइयों के लिए)
                if (mcq.chapter !== currentChapter) {
                    let unitTitle = '';
                    if (mcq.chapter === 'जनन') unitTitle = 'इकाई I: जनन (Reproduction)';
                    else if (mcq.chapter === 'आनुवंशिकी और विकास') unitTitle = 'इकाई II: आनुवंशिकी और विकास (Genetics and Evolution)';
                    else if (mcq.chapter === 'मानव कल्याण') unitTitle = 'इकाई III: मानव कल्याण में जीव विज्ञान (Biology and Human Welfare)';
                    else if (mcq.chapter === 'जैव प्रौद्योगिकी') unitTitle = 'इकाई IV: जैव प्रौद्योगिकी (Biotechnology)';
                    else if (mcq.chapter === 'पारिस्थितिकी') unitTitle = 'इकाई V: पारिस्थितिकी और पर्यावरण (Ecology and Environment)';
                    
                    htmlContent += `<h3>${unitTitle}</h3>`;
                    currentChapter = mcq.chapter;
                }

                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    const displayOption = option; // No complex math symbols to replace here
                    
                    htmlContent += `<label><input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${displayOption}</label>`;
                });
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });
            form.innerHTML = htmlContent;
        }

        function checkAnswers(event) {
            if (event) event.preventDefault(); 
            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');
            
            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';

                const correctAnswerDisplay = mcq.answer;

                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                }
            });

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score / totalQuestions >= 0.8 ? 'green' : (score / totalQuestions >= 0.5 ? 'orange' : 'red')}; font-size: 1.2em;">
                    ${score / totalQuestions >= 0.8 ? 'उत्कृष्ट! आपने संपूर्ण पाठ्यक्रम को बहुत अच्छे से कवर किया है। 🌟' : (score / totalQuestions >= 0.5 ? 'अच्छा प्रयास। कुछ महत्वपूर्ण इकाइयों पर अधिक ध्यान देने की आवश्यकता है।' : 'सिद्धांतों को फिर से दोहराएं। यह एक संपूर्ण पाठ्यक्रम की तैयारी का समय है।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;
            window.scrollTo(0, 0);
        }

        window.onload = renderTest;

    </script>
