        // render the quiz questions into the form
        function renderTest() {
            const form = document.getElementById('quizForm');
            if (!form) {
                console.error('Quiz form element not found.');
                return;
            }

            let htmlContent = '';
            testQuestions.forEach((mcq, index) => {
                // ensure values are properly escaped for HTML (simple replace)
                const safeQuestion = String(mcq.question).replace(/</g, '&lt;').replace(/>/g, '&gt;');

                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. [${mcq.chapter}] ${safeQuestion}</div>`;
                htmlContent += `<div class="options">`;

                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    const safeOption = String(option).replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    htmlContent += `<label><input type="radio" name="q${mcq.id}" value="${safeOption}"> ${optionChar}) ${safeOption}</label>`;
                });

                htmlContent += `</div>`;
                // feedback div is created here to ensure existence
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });

            form.innerHTML = htmlContent;

            // enable submit button now that questions are rendered
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.disabled = false;
        }

        // safe function to get element and warn if missing
        function ensureElement(parent, selector) {
            const el = parent ? parent.querySelector(selector) : null;
            if (!el) console.warn('Missing element for selector:', selector);
            return el;
        }

        // check answers with null-safety checks
        function checkAnswers(event) {
            if (event && typeof event.preventDefault === 'function') event.preventDefault();

            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');

            if (!form) {
                console.error('Form not found when checking answers. Aborting.');
                return;
            }

            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);

                // if questionBox is missing, skip gracefully and mark as unanswered
                if (!questionBox) {
                    console.warn(`Question box for id ${mcq.id} not found. Skipping.`);
                    return; // skip to next question
                }

                // feedbackDiv: if missing, create it and append
                let feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                if (!feedbackDiv) {
                    feedbackDiv = document.createElement('div');
                    feedbackDiv.id = `feedback-q${mcq.id}`;
                    feedbackDiv.className = 'feedback';
                    questionBox.appendChild(feedbackDiv);
                }

                // reset styles safely
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';

                if (selectedOption) {
                    // compare values exactly as strings
                    if (String(selectedOption.value) === String(mcq.answer)) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                }
            });

            // show results
            if (resultsDiv) {
                resultsDiv.style.display = 'block';
                const perc = totalQuestions ? (score / totalQuestions) : 0;
                const msg = perc >= 0.8 ? 'उत्कृष्ट! द्वैत प्रकृति पर आपकी पकड़ मजबूत है। 🌟' : (perc >= 0.5 ? 'अच्छा प्रयास। मुख्य सिद्धांतों पर अधिक ध्यान दें।' : 'सिद्धांतों को फिर से दोहराएं।');

                resultsDiv.innerHTML = `\n                    <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>\n                    <p style="color: ${perc >= 0.8 ? 'green' : (perc >= 0.5 ? 'orange' : 'red')}; font-size: 1.2em;">${msg}</p>\n                    <p>कुल सही उत्तर: ${score}</p>\n                    <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>\n                `;

                // scroll to results for better UX
                resultsDiv.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // attach events after DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            renderTest();
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.addEventListener('click', checkAnswers);
        });

    </script>
