            { id: 10, question: "'स्वराज' शब्द का उल्लेख करने वाली पहली कांग्रेस प्रमुख कौन थीं?", options: ["एनी बेसेंट", "सरोजिनी नायडू", "इंदिरा गाँधी", "कस्तूरबा गाँधी"], answer: "एनी बेसेंट", chapter: "इतिहास: भारत में राष्ट्रवाद", explanation: "एनी बेसेंट 1917 में भारतीय राष्ट्रीय कांग्रेस की पहली महिला अध्यक्ष बनीं।" },

            // अध्याय 3: भूमंडलीकृत विश्व का बनना (5 Qs)

            { id: 14, question: "सिल्क रूट (रेशम मार्ग) मुख्य रूप से किन क्षेत्रों को जोड़ता था?", options: ["भारत को चीन से", "एशिया को यूरोप और उत्तरी अफ्रीका से", "उत्तरी अमेरिका को दक्षिणी अमेरिका से", "यूरोप को अफ्रीका से"], answer: "एशिया को यूरोप और उत्तरी अफ्रीका से", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "सिल्क रूट व्यापार और सांस्कृतिक विनिमय का मुख्य मार्ग था।" },
            { id: 15, question: "वेनेजुएला और पेरू में यूरोपीय लोगों के लिए सबसे अधिक मूल्यवान धातु कौन सी थी?", options: ["सोना", "चाँदी", "तांबा", "टीन"], answer: "चाँदी", chapter: "इतिहास: भूमंडलीकृत विश्व का बनना", explanation: "चाँदी के भंडार ने यूरोप की संपत्ति में वृद्धि की।" },

            // अध्याय 4: औद्योगीकरण का युगकरण (5 Qs)

            { id: 17, question: "'स्पिनिंग जेनी' का आविष्कार किसने किया?", options: ["जेम्स वॉट", "आर्कराइट", "जेम्स हरग्रीव्स", "जॉन के"], answer: "जेम्स हरग्रीव्स", chapter: "इतिहास: औद्योगीकरण का युग", explanation: "स्पिनिंग जेनी ने कताई प्रक्रिया को तेज किया।" },

        // --- JavaScript फ़ंक्शंस (पिछले टेस्ट से समान, लेकिन नए डेटा के साथ कार्यशील) ---

        // प्रश्नों को HTML में रेंडर करें
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';

            testQuestions.forEach((mcq, index) => {
                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. [${mcq.chapter}] ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    htmlContent += `<label>`;
                    htmlContent += `<input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${option}`;
                    htmlContent += `</label>`;
                });
                
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });

            form.innerHTML = htmlContent;
        }

        // उत्तरों की जाँच करें और स्कोर प्रदर्शित करें
        function checkAnswers(event) {
            if (event) event.preventDefault(); 

            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');

            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';
                
                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                }

                // स्पष्टीकरण जोड़ें
                feedbackDiv.innerHTML += `<div class="explanation">स्पष्टीकरण: ${mcq.explanation}</div>`;
            });

            // परिणाम प्रदर्शित करें
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score >= 80 ? 'green' : (score >= 50 ? 'orange' : 'red')}; font-size: 1.5em;">
                    ${score >= 80 ? 'शानदार! दूसरे टेस्ट में भी बेहतरीन प्रदर्शन! 🚀' : (score >= 50 ? 'अच्छा प्रयास। निरंतर अभ्यास करते रहें।' : 'बेहतर स्कोर के लिए विषयों पर ध्यान दें।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;

            window.scrollTo(0, 0);
        }

        // पेज लोड होने पर टेस्ट प्रदर्शित करें
        window.onload = renderTest;

    </script>
