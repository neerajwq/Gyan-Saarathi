    <script>
        // --- 100 MCQs का डेटा सरणी (संपूर्ण पाठ्यक्रम रसायन विज्ञान) ---
        const testQuestions = [
            // इकाई I: विलयन और ठोस अवस्था (Solutions & Solid State) - (Q1-15)
            { id: 1, question: "क्वथनांक का उन्नयन (Elevation of Boiling Point) किस पर निर्भर करता है?", options: ["विलय के मोलों की संख्या पर","विलायक की प्रकृति पर","क्वथनांक की प्रकृति पर","वाष्प दाब"], answer: "विलय के मोलों की संख्या पर", chapter: "भौतिक रसायन" },
            { id: 2, question: "राउल्ट का नियम (Raoult's Law) किस पर लागू होता है?", options: ["अवाष्पशील विलय","वाष्पशील विलय","ठोस विलय","आदर्श और गैर-आदर्श विलय"], answer: "अवाष्पशील विलय", chapter: "भौतिक रसायन" },
            { id: 3, question: "मोलरता (Molarity) की इकाई क्या है?", options: ["मोल प्रति लीटर","मोल प्रति किलोग्राम","ग्राम प्रति लीटर","लीटर प्रति मोल"], answer: "मोल प्रति लीटर", chapter: "भौतिक रसायन" },
            { id: 4, question: "शॉटकी दोष (Schottky Defect) किसके घनत्व को प्रभावित करता है?", options: ["घनत्व कम होता है","घनत्व बढ़ता है","कोई परिवर्तन नहीं होता","अज्ञात"], answer: "घनत्व कम होता है", chapter: "भौतिक रसायन" },
            { id: 5, question: "मोललता (Molality) को व्यक्त करने के लिए किस पद का उपयोग किया जाता है?", options: ["विलय के मोल प्रति विलायक का किलोग्राम","विलय के मोल प्रति विलयन का लीटर","ग्राम प्रति लीटर","आयतन"], answer: "विलय के मोल प्रति विलायक का किलोग्राम", chapter: "भौतिक रसायन" },
            { id: 6, question: "विलयन जो राउल्ट के नियम से धनात्मक विचलन (Positive Deviation) दर्शाता है, उसमें मिश्रण की एन्थैल्पी ($$\Delta H_{mix}$$) क्या होती है?", options: ["धनात्मक ($$ > 0$$)","ऋणात्मक ($$ < 0$$)","शून्य","अज्ञात"], answer: "धनात्मक ($$ > 0$$)", chapter: "भौतिक रसायन" },
            { id: 7, question: "परासरण दाब (Osmotic Pressure) के लिए कौन सा सूत्र सही है?", options: ["$$\pi = CRT$$","$$\pi = \frac{C}{RT}$$","$$\pi = \frac{RT}{C}$$","$$\pi = CT$$"], answer: "$$\pi = CRT$$", chapter: "भौतिक रसायन" },
            { id: 8, question: "घनीय संरचना (Cubic Structure) में प्रति इकाई सेल (Unit Cell) परमाणुओं की अधिकतम संख्या किसमें होती है?", options: ["फलक-केंद्रित घनीय (FCC)","काय-केंद्रित घनीय (BCC)","सरल घनीय (Simple Cubic)","चतुष्कोणीय"], answer: "फलक-केंद्रित घनीय (FCC)", chapter: "भौतिक रसायन" },
            { id: 9, question: "ठोस अवस्था में 'F-केंद्र' (F-Centre) क्या उत्पन्न करता है?", options: ["रंग (Colour)","घनत्व में कमी","चालकता","अतिचालकता"], answer: "रंग (Colour)", chapter: "भौतिक रसायन" },
            { id: 10, question: "ठोसों में डोपिंग (Doping) क्यों की जाती है?", options: ["चालकता बढ़ाने के लिए","रंग बदलने के लिए","घनत्व कम करने के लिए","पिघलने के लिए"], answer: "चालकता बढ़ाने के लिए", chapter: "भौतिक रसायन" },
            { id: 11, question: "ठोसों में कौन सा बल कार्य करता है?", options: ["वान्डरवाल्स बल","आयनिक बल","सहसंयोजक बल","सभी विकल्प"], answer: "सभी विकल्प", chapter: "भौतिक रसायन" },
            { id: 12, question: "फ्रेंकल दोष (Frenkel Defect) के कारण क्रिस्टल का घनत्व क्या होता है?", options: ["अपरिवर्तित रहता है","कम हो जाता है","बढ़ जाता है","शून्य"], answer: "अपरिवर्तित रहता है", chapter: "भौतिक रसायन" },
            { id: 13, question: "विद्युत अनअपघट्य (Non-electrolyte) के लिए वान्ट हॉफ गुणांक ($$i$$) का मान क्या है?", options: ["1","0","2","0.5"], answer: "1", chapter: "भौतिक रसायन" },
            { id: 14, question: "एक क्रिस्टल में धनायन और ऋणायन का आकार लगभग समान हो, तो कौन सा दोष होने की संभावना है?", options: ["शॉटकी दोष","फ्रेंकल दोष","F-केंद्र","अशुद्धि दोष"], answer: "शॉटकी दोष", chapter: "भौतिक रसायन" },
            { id: 15, question: "विलायक अणुओं का अर्धपारगम्य झिल्ली के माध्यम से कम सांद्रता से उच्च सांद्रता की ओर प्रवाह क्या कहलाता है?", options: ["परासरण (Osmosis)","विसरण","निष्क्रिय परिवहन","उत्क्रम परासरण"], answer: "परासरण (Osmosis)", chapter: "भौतिक रसायन" },

            // इकाई II: इलेक्ट्रोकेमिस्ट्री और रासायनिक बलगतिकी (Electrochemistry & Chemical Kinetics) - (Q16-30)
            { id: 16, question: "फैराडे का विद्युत अपघटन का पहला नियम किससे संबंधित है?", options: ["इलेक्ट्रोड पर जमा पदार्थ की मात्रा","सेल का EMF","अर्ध-आयु काल","अभिक्रिया की दर"], answer: "इलेक्ट्रोड पर जमा पदार्थ की मात्रा", chapter: "भौतिक रसायन" },
            { id: 17, question: "मानक हाइड्रोजन इलेक्ट्रोड (SHE) का विभव क्या होता है?", options: ["0 वोल्ट","1.0 वोल्ट","0.5 वोल्ट","2.0 वोल्ट"], answer: "0 वोल्ट", chapter: "भौतिक रसायन" },
            { id: 18, question: "संचायक सेल (Storage Cell) का उदाहरण क्या है?", options: ["लेड स्टोरेज बैटरी (Lead Storage Battery)","डेनियल सेल","शुष्क सेल","ईंधन सेल"], answer: "लेड स्टोरेज बैटरी (Lead Storage Battery)", chapter: "भौतिक रसायन" },
            { id: 19, question: "अभिक्रिया की दर (Rate of Reaction) की इकाई क्या है?", options: ["$$mol L^{-1} s^{-1}$$","$$mol s^{-1}$$","$$L mol^{-1} s^{-1}$$","$$mol^2 L^{-2} s^{-1}$$"], answer: "$$mol L^{-1} s^{-1}$$", chapter: "भौतिक रसायन" },
            { id: 20, question: "प्रथम कोटि की अभिक्रिया (First Order Reaction) के लिए अर्ध-आयु काल ($$t_{1/2}$$) किस पर निर्भर नहीं करता है?", options: ["अभिकारक की प्रारंभिक सांद्रता","तापमान","सक्रियण ऊर्जा","दर स्थिरांक"], answer: "अभिकारक की प्रारंभिक सांद्रता", chapter: "भौतिक रसायन" },
            { id: 21, question: "सक्रियण ऊर्जा (Activation Energy) क्या है?", options: ["अभिकारक को उत्पाद में बदलने के लिए आवश्यक न्यूनतम ऊर्जा","उत्पाद की ऊर्जा","अभिकारक की ऊर्जा","अभिक्रिया की दर"], answer: "अभिकारक को उत्पाद में बदलने के लिए आवश्यक न्यूनतम ऊर्जा", chapter: "भौतिक रसायन" },
            { id: 22, question: "तापमान में वृद्धि से अभिक्रिया की दर क्यों बढ़ती है?", options: ["अधिक अणुओं के पास सक्रियण ऊर्जा होती है","आणविक टकराव कम होते हैं","अणु अधिक स्थिर होते हैं","सक्रियण ऊर्जा कम हो जाती है"], answer: "अधिक अणुओं के पास सक्रियण ऊर्जा होती है", chapter: "भौतिक रसायन" },
            { id: 23, question: "नर्न्स्ट समीकरण (Nernst Equation) का उपयोग किसके लिए किया जाता है?", options: ["इलेक्ट्रोड विभव की गणना","साम्य स्थिरांक की गणना","अभिक्रिया की दर की गणना","तापमान का प्रभाव"], answer: "इलेक्ट्रोड विभव की गणना", chapter: "भौतिक रसायन" },
            { id: 24, question: "शून्य कोटि की अभिक्रिया (Zero Order Reaction) के लिए दर स्थिरांक की इकाई क्या है?", options: ["$$mol L^{-1} s^{-1}$$","$$s^{-1}$$","$$L mol^{-1} s^{-1}$$","$$mol^2 L^{-2} s^{-1}$$"], answer: "$$mol L^{-1} s^{-1}$$", chapter: "भौतिक रसायन" },
            { id: 25, question: "उत्प्रेरक (Catalyst) का कार्य क्या है?", options: ["अभिक्रिया की सक्रियण ऊर्जा कम करना","साम्य स्थिरांक बदलना","उत्पाद की मात्रा बढ़ाना","अभिकारक की सांद्रता कम करना"], answer: "अभिक्रिया की सक्रियण ऊर्जा कम करना", chapter: "भौतिक रसायन" },
            { id: 26, question: "गैल्वेनिक सेल (Galvanic Cell) में एनोड (Anode) पर कौन सी प्रक्रिया होती है?", options: ["ऑक्सीकरण (Oxidation)","अपचयन","उदासीनीकरण","पनर्युग्मन"], answer: "ऑक्सीकरण (Oxidation)", chapter: "भौतिक रसायन" },
            { id: 27, question: "ईंधन सेल (Fuel Cell) का मुख्य उद्देश्य क्या है?", options: ["ईंधन की रासायनिक ऊर्जा को सीधे विद्युत ऊर्जा में बदलना","यांत्रिक ऊर्जा को विद्युत में बदलना","गर्मी उत्पन्न करना","भंडारण"], answer: "ईंधन की रासायनिक ऊर्जा को सीधे विद्युत ऊर्जा में बदलना", chapter: "भौतिक रसायन" },
            { id: 28, question: "कोलराउश नियम (Kohlrausch's Law) किससे संबंधित है?", options: ["अनंत तनुता पर मोलर चालकता","विशिष्ट चालकता","सेल का EMF","अभिक्रिया की कोटि"], answer: "अनंत तनुता पर मोलर चालकता", chapter: "भौतिक रसायन" },
            { id: 29, question: "आर्हेनियस समीकरण (Arrhenius Equation) किसके बीच संबंध स्थापित करता है?", options: ["दर स्थिरांक और तापमान","सांद्रता और दर","तापमान और दाब","आणविकता और कोटि"], answer: ["दर स्थिरांक और तापमान"], chapter: "भौतिक रसायन" },
            { id: 30, question: "अभिक्रिया की आणविकता (Molecularity) हमेशा क्या होती है?", options: ["एक पूर्ण संख्या","भिन्नात्मक","शून्य","कोई भी मान"], answer: "एक पूर्ण संख्या", chapter: "भौतिक रसायन" },

            // इकाई III: उपसहसंयोजक यौगिक और D & F ब्लॉक (Coordination Compounds & D & F Block) - (Q31-45)
            { id: 31, question: "संक्रमण तत्व (Transition Elements) सामान्यतः क्या दर्शाते हैं?", options: ["परिवर्तनीय ऑक्सीकरण अवस्थाएँ","केवल एक ऑक्सीकरण अवस्था","केवल ऋणात्मक ऑक्सीकरण अवस्थाएँ","उच्च आयनीकरण ऊर्जा"], answer: "परिवर्तनीय ऑक्सीकरण अवस्थाएँ", chapter: "अकार्बनिक रसायन" },
            { id: 32, question: "लेन्थेनॉइड्स (Lanthanoids) में कौन सी ऑक्सीकरण अवस्था सबसे सामान्य है?", options: ["+3","+2","+4","+5"], answer: "+3", chapter: "अकार्बनिक रसायन" },

            { id: 99, question: "निम्न में से कौन प्राकृतिक बहुलक (Natural Polymer) है?", options: ["रबर (Rubber)","नायलॉन","टेफ्लॉन","पॉलीथीन"], answer: "रबर (Rubber)", chapter: "अन्य" },
            { id: 100, question: "ऐल्डिहाइड और कीटोन का पता लगाने के लिए कौन सा अभिकर्मक उपयोग किया जाता है?", options: ["2,4-डाइनाइट्रोफेनिलहाइड्रेजीन (2,4-DNP)","फेहलिंग विलयन","टॉलेंस अभिकर्मक","सभी विकल्प"], answer: "सभी विकल्प", chapter: "कार्बनिक रसायन" }
        ];


        // --- JavaScript फ़ंक्शंस (रेंडरिंग और चेकिंग लॉजिक) ---
        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';
            let currentChapter = '';

            testQuestions.forEach((mcq, index) => {
                // अध्याय के आधार पर हेडिंग जोड़ना (प्रमुख इकाइयों के लिए)
                if (mcq.chapter !== currentChapter) {
                    let unitTitle = '';
                    if (mcq.chapter === 'भौतिक रसायन') unitTitle = 'इकाई I & II: भौतिक रसायन (विलयन, बलगतिकी, इलेक्ट्रो)';
                    else if (mcq.chapter === 'अकार्बनिक रसायन') unitTitle = 'इकाई III: अकार्बनिक रसायन (D & F ब्लॉक, उपसहसंयोजक)';
                    else if (mcq.chapter === 'कार्बनिक रसायन') unitTitle = 'इकाई IV & V: कार्बनिक रसायन (हैलोऐल्केन, ऐल्कोहॉल, ऐमीन, जैव-अणु)';
                    else if (mcq.chapter === 'अन्य') unitTitle = 'इकाई V: अन्य महत्वपूर्ण विषय (पृष्ठ रसायन, बहुलक, दैनिक जीवन में)';
                    
                    htmlContent += `<h3>${unitTitle}</h3>`;
                    currentChapter = mcq.chapter;
                }

                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    // LaTeX rendering for chemical formulas/equations
                    const displayOption = option
                        .replace(/\$\$([\s\S]*?)\$\$/g, (match, p1) => {
                            // Simple replacements for common superscripts/subscripts and symbols
                            return p1.replace(/\\Delta H_{mix}/g, '&Delta;H<sub>mix</sub>')
                                    .replace(/pi = CRT/g, '&pi; = CRT')
                                    .replace(/mol L\^{-1} s\^{-1}/g, 'mol L<sup>-1</sup> s<sup>-1</sup>')
                                    .replace(/mol s\^{-1}/g, 'mol s<sup>-1</sup>')
                                    .replace(/L mol\^{-1} s\^{-1}/g, 'L mol<sup>-1</sup> s<sup>-1</sup>')
                                    .replace(/mol\^2 L\^{-2} s\^{-1}/g, 'mol<sup>2</sup> L<sup>-2</sup> s<sup>-1</sup>')
                                    .replace(/t_{1\/2}/g, 't<sub>1/2</sub>')
                                    .replace(/s\^{-1}/g, 's<sup>-1</sup>')
                                    .replace(/pi = C\/RT/g, '&pi; = C/RT')
                                    .replace(/pi = RT\/C/g, '&pi; = RT/C')
                                    .replace(/pi = CT/g, '&pi; = CT')
                                    .replace(/CH_3X > 1\\circ > 2\\circ > 3\\circ/g, 'CH<sub>3</sub>X > 1&deg; > 2&deg; > 3&deg;')
                                    .replace(/3\\circ > 2\\circ > 1\\circ > CH_3X/g, '3&deg; > 2&deg; > 1&deg; > CH<sub>3</sub>X')
                                    .replace(/2\\circ > 1\\circ > 3\\circ/g, '2&deg; > 1&deg; > 3&deg;')
                                    .replace(/3\\circ > CH_3X > 1\\circ/g, '3&deg; > CH<sub>3</sub>X > 1&deg;')
                                    .replace(/sp\^2/g, 'sp<sup>2</sup>')
                                    .replace(/sp\^3/g, 'sp<sup>3</sup>')
                                    .replace(/sp/g, 'sp')
                                    .replace(/dsp\^2/g, 'dsp<sup>2</sup>')
                                    .replace(/Sc\^{3+}/g, 'Sc<sup>3+</sup>')
                                    .replace(/Ti\^{3+}/g, 'Ti<sup>3+</sup>')
                                    .replace(/V\^{3+}/g, 'V<sup>3+</sup>')
                                    .replace(/Cr\^{3+}/g, 'Cr<sup>3+</sup>')
                                    .replace(/0\^\\circ\mathrm{C}\s\text{से}\s5\^\\circ\mathrm{C}/g, '0&deg;C से 5&deg;C')
                                    .replace(/25\^\\circ\mathrm{C}\s\text{से}\s35\^\\circ\mathrm{C}/g, '25&deg;C से 35&deg;C')
                                    .replace(/50\^\\circ\mathrm{C}\s\text{से}\s60\^\\circ\mathrm{C}/g, '50&deg;C से 60&deg;C')
                                    .replace(/100\^\\circ\mathrm{C}\s\text{से}\s\text{ऊपर}/g, '100&deg;C से ऊपर')
                                    .replace(/H_2SO_4/g, 'H<sub>2</sub>SO<sub>4</sub>')
                                    .replace(/Br_2/g, 'Br<sub>2</sub>')
                                    .replace(/RMgX/g, 'RMgX')
                                    .replace(/2\\circ/g, '2&deg;')
                                    .replace(/1\\circ/g, '1&deg;')
                                    .replace(/alpha/g, '&alpha;');
                        });
                    
                    htmlContent += `<label><input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${displayOption}</label>`;
                });
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });
            form.innerHTML = htmlContent;
        }

        function checkAnswers(event) {
            if (event) event.preventDefault(); 
            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');
            
            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';

                const correctAnswerDisplay = mcq.answer
                    .replace(/\$\$([\s\S]*?)\$\$/g, (match, p1) => {
                        return p1.replace(/\\Delta H_{mix}/g, '&Delta;H<sub>mix</sub>')
                                .replace(/pi = CRT/g, '&pi; = CRT')
                                .replace(/mol L\^{-1} s\^{-1}/g, 'mol L<sup>-1</sup> s<sup>-1</sup>')
                                .replace(/mol s\^{-1}/g, 'mol s<sup>-1</sup>')
                                .replace(/L mol\^{-1} s\^{-1}/g, 'L mol<sup>-1</sup> s<sup>-1</sup>')
                                .replace(/mol\^2 L\^{-2} s\^{-1}/g, 'mol<sup>2</sup> L<sup>-2</sup> s<sup>-1</sup>')
                                .replace(/t_{1\/2}/g, 't<sub>1/2</sub>')
                                .replace(/s\^{-1}/g, 's<sup>-1</sup>')
                                .replace(/CH_3X > 1\\circ > 2\\circ > 3\\circ/g, 'CH<sub>3</sub>X > 1&deg; > 2&deg; > 3&deg;')
                                .replace(/sp\^2/g, 'sp<sup>2</sup>')
                                .replace(/sp\^3/g, 'sp<sup>3</sup>')
                                .replace(/Sc\^{3+}/g, 'Sc<sup>3+</sup>')
                                .replace(/0\^\\circ\mathrm{C}\s\text{से}\s5\^\\circ\mathrm{C}/g, '0&deg;C से 5&deg;C')
                                .replace(/2\\circ/g, '2&deg;');
                    });

                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${correctAnswerDisplay}</span>`;
                }
            });

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score / totalQuestions >= 0.8 ? 'green' : (score / totalQuestions >= 0.5 ? 'orange' : 'red')}; font-size: 1.2em;">
                    ${score / totalQuestions >= 0.8 ? 'उत्कृष्ट! रसायन विज्ञान में आपकी पकड़ मजबूत है। 🌟' : (score / totalQuestions >= 0.5 ? 'अच्छा प्रयास। मुख्य अवधारणाओं पर अधिक ध्यान दें।' : 'सिद्धांतों को फिर से दोहराएं। यह एक संपूर्ण पाठ्यक्रम की तैयारी का समय है।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;
            window.scrollTo(0, 0);
        }

        window.onload = renderTest;

    </script>
