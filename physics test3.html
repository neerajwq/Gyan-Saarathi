        const testQuestions = [
            // किरण प्रकाशिकी (Ray Optics)
            { id: 1, question: "लेंस की शक्ति (Power) की SI इकाई क्या है?", options: ["मीटर","डायोप्टर","कैंडेला","वाट"], answer: "डायोप्टर", chapter: "किरण प्रकाशिकी" },
            { id: 2, question: "व्यासवाला समतल लेंस को क्या कहते हैं जो दोनों ओर उसी त्रिज्या के होते हैं?", options: ["समकेंद्रीय लेंस","समदृश्य लेंस","समद्विबाहु लेंस","समानत्रिज्य लेंस"], answer: "समानत्रिज्य लेंस", chapter: "किरण प्रकाशिकी" },
            { id: 3, question: "वृत्तीय दबावक के नियम के अनुसार एक सन्निकट लेंस की पतलापन के लिए कौन सा फॉर्मूला उपयोग होता है?", options: ["लेंस मेकर फ़ॉर्मूला","बर्नोली समीकरण","स्नेल का नियम","रिले सिद्धांत"], answer: "लेंस मेकर फ़ॉर्मूला", chapter: "किरण प्रकाशिकी" },
{ id: 4, question: "सूतक (focal length) की परिभाषा क्या है?", options: ["लेंस की मोटाई","वो दूरी जहाँ समवर्ति किरणें मिलती हैं","लेंस की शक्ति","लेंस की अपवर्तनांक"], answer: "वो दूरी जहाँ समवर्ति किरणें मिलती हैं", chapter: "किरण प्रकाशिकी" },
{ id: 5, question: "यदि लेंस की फोकल लंबाई 0.5 m है तो उसकी शक्ति क्या होगी?", options: ["0.5 D","2 D","-2 D","-0.5 D"], answer: "2 D", chapter: "किरण प्रकाशिकी" },
{ id: 6, question: "पार्श्विक विकृति (aberration) किसे कहते हैं?", options: ["छवि में होने वाली त्रुटियाँ","लेंस का सही फोकस","दीप्ति में वृद्धि","प्रकाश का परावर्तन"], answer: "छवि में होने वाली त्रुटियाँ", chapter: "किरण प्रकाशिकी" },
{ id: 7, question: "व्यासवाले (convex) लेंस को अंग्रेज़ी में क्या कहते हैं?", options: ["Concave lens","Convex lens","Plano lens","Cylindrical lens"], answer: "Convex lens", chapter: "किरण प्रकाशिकी" },
{ id: 8, question: "यदि एक समलम्ब लेंस के दोनों ओर के वक्रता की त्रिज्या R और -R है और अपवर्तनांक n = 1.5 है, तो लेंस की शक्ति (thin lens) क्या होगी?", options: ["0 D","(n-1)(2/R)","(n-1)(1/R - 1/(-R))","(n-1)(1/R + 1/R)"], answer: "(n-1)(1/R - 1/(-R))", chapter: "किरण प्रकाशिकी" },
{ id: 9, question: "संकेंद्रणांक (refractive index) का प्रयोग किसे मापने के लिए होता है?", options: ["प्रकाश की आवृत्ति","किसी माध्यम में प्रकाश की गति का अनुपात","लेंस की मोटाई","वोल्टता"], answer: "किसी माध्यम में प्रकाश की गति का अनुपात", chapter: "किरण प्रकाशिकी" },
{ id: 10, question: "यदि ऑब्जेक्ट किसी लेंस के बीच में (between focal point and lens) रखा हो तो छवि कैसी बनेगी?", options: ["वर्चुअल और बड़ा","वास्तविक और उल्टा","वर्चुअल और छोटा","वास्तविक और बड़ा"], answer: "वर्चुअल और बड़ा", chapter: "किरण प्रकाशिकी" },
{ id: 11, question: "दो समवर्ती दीर्घताएँ f1 और f2 वाली लेंसों को साथ जोड़ने पर संयुक्त शक्ति P = ?", options: ["f1 + f2","1/f1 + 1/f2","P1 + P2","(P1*P2)/(P1+P2)"], answer: "P1 + P2", chapter: "किरण प्रकाशिकी" },
{ id: 12, question: "माइक्रोस्कोप के ऑब्जेक्टिव का फोकल लंबाई सामान्यतः कैसी होती है?", options: ["बहुत लंबी","बहुत छोटी","मध्यम","अनिश्चित"], answer: "बहुत छोटी", chapter: "किरण प्रकाशिकी" },
{ id: 13, question: "यदि किसी लेंस की शक्ति -4 D है तो यह किस प्रकार का लेंस है?", options: ["व्यासवाला (Convex)","कुंडलाकार (Concave)","समानपट्टी (Plano)","दुबला"], answer: "कुंडलाकार (Concave)", chapter: "किरण प्रकाशिकी" },
{ id: 14, question: "नज़दीकी बिंदु (near point) सामान्य मानव आंख का औसत लगभग क्या है?", options: ["25 cm","10 cm","1 m","50 cm"], answer: "25 cm", chapter: "किरण प्रकाशिकी" },
{ id: 15, question: "प्रकाश के परावर्तन (reflection) का नियमानुसार कोण के संबंध कैसे रहते हैं?", options: ["आवागमन कोण = परावर्तन कोण","आवागमन कोण = अपवर्तन कोण","परावर्तन कोण = 90°","आवागमन कोण = 0"], answer: "आवागमन कोण = परावर्तन कोण", chapter: "किरण प्रकाशिकी" },
{ id: 16, question: "स्नेल का नियम किससे संबंधित है?", options: ["अपवर्तन और अपवर्तनांक","परावर्तन और अपवर्तनांक","दाब और तापमान","वोल्टता और धारा"], answer: "अपवर्तन और अपवर्तनांक", chapter: "किरण प्रकाशिकी" },
{ id: 17, question: "यदि प्रकाश का अपवर्तनांक n1 से n2 में बदलता है तो कौन-सा गुण समान रहता है?", options: ["प्रकाश की आवृत्ति","प्रकाश की तरंगदैर्ध्य","प्रकाश की गति","ऊर्जा"], answer: "प्रकाश की आवृत्ति", chapter: "किरण प्रकाशिकी" },
{ id: 18, question: "व्स्तु और छवि के बीच वास्तविक फॉर्मूला ( lens formula ) क्या है?", options: ["1/f = 1/v + 1/u","1/f = 1/u - 1/v","f = u + v","uv = f"], answer: "1/f = 1/v + 1/u", chapter: "किरण प्रकाशिकी" },
{ id: 19, question: "दूरी अनुपात (magnification) m = ?", options: ["v/u","u/v","f/v","v+u"], answer: "v/u", chapter: "किरण प्रकाशिकी" },
{ id: 20, question: "यदि एक व्यक्ति इमेजिंग के लिए -2 D के चश्मे पहनता है तो उनका नज़दीकी फोकल किस प्रकार का होगा?", options: ["दूर देखने के लिए निर्दिष्ट","नज़दीकी देखने के लिए सहायक","यह परिभाषित नहीं","चश्मे की पॉवर"], answer: "दूर देखने के लिए निर्दिष्ट", chapter: "किरण प्रकाशिकी" },
{ id: 21, question: "यदि किसी माध्यम का अपवर्तनांक बड़ा हो तो प्रकाश की गति उस माध्यम में कैसे होगी?", options: ["तेज़","धीमी","उसी तरह","अनिश्चित"], answer: "धीमी", chapter: "किरण प्रकाशिकी" },
{ id: 22, question: "यदि एक समद्विबाहु लेंस (plano-convex) का एक मुख सपाट हो तो उसे किस उद्देश्य के लिए अधिकतर प्रयोग किया जाता है?", options: ["बेहतर परावर्तन के लिये","न्यूनतम अपवर्तक दोषों के लिये","विस्तार के लिये","दूरबीनों में"], answer: "न्यूनतम अपवर्तक दोषों के लिये", chapter: "किरण प्रकाशिकी" },
{ id: 23, question: "छवि का आकार और निर्देश क्या दर्शाता है?", options: ["आयाम और दिशा","रंग और चमक","स्थान और समय","विकिरण और तरंग"], answer: "आयाम और दिशा", chapter: "किरण प्रकाशिकी" },
{ id: 24, question: "यदि ऑब्जेक्ट फोकल लंबाई से बहुत दूर पर है (u → ∞), तो लेंस की छवि किस स्थान पर बनेगी?", options: ["यहि बिंदु पर जहाँ फोकल है","लेंस के पीछे अनिश्चित दूरी पर","वहां नहीं बनेगी","लेंस पर"], answer: "यहि बिंदु पर जहाँ फोकल है", chapter: "किरण प्रकाशिकी" },
{ id: 25, question: "आइरिस की भूमिका आँख में क्या होती है?", options: ["प्रकाश का परावर्तन","प्रकाश की तीव्रता नियंत्रित करना","दृष्टि शक्ति बढ़ाना","लेंस को समर्थन देना"], answer: "प्रकाश की तीव्रता नियंत्रित करना", chapter: "किरण प्रकाशिकी" },
{ id: 26, question: "हाइपोसीया (hypermetropia) में आँख की कमजोरी किस वजह से होती है?", options: ["आईबॉल का बहुत लंबा होना","आईबॉल का छोटा होना या लेंस की शक्ति कम होना","लेंस का फूहड़ होना","आँख के भीतरी दबाव"], answer: "आईबॉल का छोटा होना या लेंस की शक्ति कम होना", chapter: "किरण प्रकाशिकी" },
{ id: 27, question: "माइक्रोस्कोप और दूरबीन में कौन-सी अवधारणा सामान्य है?", options: ["लेंसों का संयोजन","स्नेल का नियम","परावर्तन के नियम","प्रकाश का उत्सर्जन"], answer: "लेंसों का संयोजन", chapter: "किरण प्रकाशिकी" },
{ id: 28, question: "यदि प्रकाश का तरंगदैर्ध्य बढ़े तो अपवर्तनांक पर इसका क्या प्रभाव होगा (सामान्य पदार्थों में)?", options: ["अपवर्तनांक बढ़ेगा","अपवर्तनांक घटेगा","कोई प्रभाव नहीं","अनिश्चित"], answer: "अपवर्तनांक घटेगा", chapter: "किरण प्रकाशिकी" },
{ id: 29, question: "आँख में अपवर्तन दोष को ठीक करने के लिए कौन-सा उपकरण प्रयोग होता है?", options: ["दर्पण","चश्मा","माइक्रोस्कोप","प्रिज्म"], answer: "चश्मा", chapter: "किरण प्रकाशिकी" },
{ id: 30, question: "परावर्तक (mirror) और लेंस में सबसे बड़ा अंतर क्या है?", options: ["परावर्तन बनाम अपवर्तन","दोनों में अंतर नहीं","लेंस अधिक भारी होते हैं","परावर्तक रंग बदलते हैं"], answer: "परावर्तन बनाम अपवर्तन", chapter: "किरण प्रकाशिकी" },
{ id: 31, question: "वक्र दर्पण (concave mirror) पर वस्तु केंद्र के बाहर रखी हो तो छवि कैसी बनेगी?", options: ["वास्तविक और उल्टी","वर्चुअल और सीधी","वास्तविक और सीधी","वर्चुअल और उल्टी"], answer: "वास्तविक और उल्टी", chapter: "किरण प्रकाशिकी" },
{ id: 32, question: "किस लेंस का उपयोग दूरदर्शिता (myopia) ठीक करने में होता है?", options: ["व्यासवाला (Convex) लेंस","कुंडलाकार (Concave) लेंस","प्लेनो लेंस","सहायक लेंस"], answer: "कुंडलाकार (Concave) लेंस", chapter: "किरण प्रकाशिकी" },
{ id: 33, question: "लेंस मेकर फॉर्मूले में यदि n = 1 (वायु के सापेक्ष) तो फॉर्मूला सरल कैसे होगा?", options: ["0","1/f = (n-1)(1/R1 - 1/R2)","1/f = 0","1/f = 1/R1 + 1/R2"], answer: "1/f = (n-1)(1/R1 - 1/R2)", chapter: "किरण प्रकाशिकी" },
{ id: 34, question: "डाइऑप्टर और मीटर में क्या संबंध है?", options: ["1 D = 1 m","1 D = 1/m","1 D = m","कोई संबंध नहीं"], answer: "1 D = 1/m", chapter: "किरण प्रकाशिकी" },
{ id: 35, question: "यदि एक लेंस की शक्ति 0.25 D है, तो उसकी फोकल लंबाई क्या होगी?", options: ["4 m","0.25 m","-4 m","1/0.25 m"], answer: "4 m", chapter: "किरण प्रकाशिकी" },

        // --- JavaScript फ़ंक्शंस (रेंडरिंग और चेकिंग लॉजिक) ---
        // (पिछले टेस्ट के समान, उत्तरों को रेंडर करने और जाँचने के लिए)

        function renderTest() {
            const form = document.getElementById('quizForm');
            let htmlContent = '';
            testQuestions.forEach((mcq, index) => {
                htmlContent += `<div class="question-box" data-id="${mcq.id}" data-answer="${mcq.answer}">`;
                htmlContent += `<div class="question-text">${index + 1}. [${mcq.chapter}] ${mcq.question}</div>`;
                htmlContent += `<div class="options">`;
                mcq.options.forEach((option, optIndex) => {
                    const optionChar = String.fromCharCode(65 + optIndex);
                    htmlContent += `<label><input type="radio" name="q${mcq.id}" value="${option}"> ${optionChar}) ${option}</label>`;
                });
                htmlContent += `</div>`;
                htmlContent += `<div class="feedback" id="feedback-q${mcq.id}" style="display:none;"></div>`;
                htmlContent += `</div>`;
            });
            form.innerHTML = htmlContent;
        }

        function checkAnswers(event) {
            if (event) event.preventDefault(); 
            let score = 0;
            const totalQuestions = testQuestions.length;
            const form = document.getElementById('quizForm');
            const resultsDiv = document.getElementById('results');
            testQuestions.forEach(mcq => {
                const selectedOption = form.querySelector(`input[name="q${mcq.id}"]:checked`);
                const questionBox = form.querySelector(`[data-id="${mcq.id}"]`);
                const feedbackDiv = document.getElementById(`feedback-q${mcq.id}`);
                questionBox.classList.remove('incorrect-highlight');
                questionBox.style.border = '1px solid #ddd';
                feedbackDiv.style.display = 'block';
                if (selectedOption) {
                    if (selectedOption.value === mcq.answer) {
                        score++;
                        questionBox.style.border = '1px solid green';
                        feedbackDiv.innerHTML = `<span class="correct-answer">✔️ सही उत्तर!</span>`;
                    } else {
                        questionBox.classList.add('incorrect-highlight');
                        questionBox.style.border = '1px solid red';
                        feedbackDiv.innerHTML = `<span style="color:red;">❌ गलत।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                    }
                } else {
                    questionBox.style.border = '1px solid orange';
                    feedbackDiv.innerHTML = `<span style="color:orange;">❓ आपने जवाब नहीं दिया।</span> <span class="correct-answer">सही उत्तर: ${mcq.answer}</span>`;
                }
            });

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h2>आपका स्कोर: ${score} / ${totalQuestions}</h2>
                <p style="color: ${score / totalQuestions >= 0.8 ? 'green' : (score / totalQuestions >= 0.5 ? 'orange' : 'red')}; font-size: 1.2em;">
                    ${score / totalQuestions >= 0.8 ? 'उत्कृष्ट! प्रकाशिकी पर आपकी पकड़ मजबूत है। 🌟' : (score / totalQuestions >= 0.5 ? 'अच्छा प्रयास। तरंग प्रकाशिकी पर अधिक ध्यान दें।' : 'सिद्धांतों को फिर से दोहराएं।')}
                </p>
                <p>कुल सही उत्तर: ${score}</p>
                <p>कुल गलत/छोड़े गए उत्तर: ${totalQuestions - score}</p>
            `;
            window.scrollTo(0, 0);
        }

        window.onload = renderTest;

    </script>
